ion openAddPaymentModal(){\n  payModalMode='form';quickPayRecordId=null;\n  var tutar=parseTRMoney(document.getElementById('tutar').value);\n  var paid=0;formPayments.forEach(function(p){paid+=parseTRMoney(p.tutar);});\n  var kalan=tutar-paid;\n  document.getElementById('qpTitle').textContent='Kapora / Tahsilat Ekle';\n  document.getElementById('qpBakiye').textContent=formatMoneyAuto(kalan>0?kalan:0)+' \\u20ba';\n  document.getElementById('qpTutar').value=(kalan>0.005)?formatMoneyAuto(kalan):'';\n  document.getElementById('qpTarih').value=getLocalTodayStr();\n  document.getElementById('quickPayOverlay').classList.add('open');\n}\n/* Kayitlar sayfasindan hizli tahsilat */\nfunction openQuickPay(id){\n  document.getElementById('detailOverlay').classList.remove('open');\n  payModalMode='record';quickPayRecordId=id;\n  var rec=records.find(function(r){return r.id===id;});\n  if(!rec)return;\n  var kalan=getRemaining(rec);\n  document.getElementById('qpTitle').textContent='H\\u0131zl\\u0131 Tahsilat';\n  document.getElementById('qpBakiye').textContent=formatMoneyAuto(kalan>0?kalan:0)+' \\u20ba';\n  document.getElementById('qpTutar').value=(kalan>0.005)?formatMoneyAuto(kalan):'';\n  document.getElementById('qpTarih').value=getLocalTodayStr();\n  document.getElementById('quickPayOverlay').classList.add('open');\n}\nfunction qpFillRemaining(){\n  var txt=(document.getElementById('qpBakiye').textContent||'').replace('\\u20ba','');\n  document.getElementById('qpTutar').value=formatMoneyAuto(parseTRMoney(txt));\n}\nfunction closeQuickPay(){document.getElementById('quickPayOverlay').classList.remove('open');quickPayMode=false;quickPayRecordId=null;}\nfunction closeQuickPayModal(e){if(!e||e.target===document.getElementById('quickPayOverlay'))closeQuickPay();}\n\n/* Modaldan gelen odeme: nakit ise direkt, kk ise banka/taksit modali */\nfunction processQuickPay(method){\n  var amt=parseTRMoney(document.getElementById('qpTutar').value);\n  var tarih=document.getElementById('qpTarih').value||getLocalTodayStr();\n  if(amt\u003c=0){toast('\\u26a0\\ufe0f Tahsilat tutar\\u0131 girin',false);return;}\n  if(method==='nakit'){\n    commitPayment({tutar:formatMoneyAuto(amt),tarih:tarih,yontem:'nakit',ccDetail:''});\n  }else{\n    quickPayMode=true;activeCCKey='payment';\n    document.getElementById('quickPayOverlay').classList.remove('open');\n    resetCCModal();document.getElementById('ccOverlay').classList.add('open');\n  }\n}\n/* Odemeyi hedefe (form veya kayit) ekle */\nfunction commitPayment(pay){\n  if(payModalMode==='form'){\n    formPayments.push(pay);\n    formPayments.sort(function(a,b){return String(a.tarih||'').localeCompare(String(b.tarih||''));});\n    formDirty=true;\n    renderPaymentList();\n    closeQuickPay();\n    toast('\\u2705 Tahsilat eklendi',true);\n    return;\n  }\n  var rec=records.find(function(r){return r.id===quickPayRecordId;});\n  if(!rec){closeQuickPay();return;}\n  var arr=getPayments(rec);\n  arr.push(pay);\n  setPayments(rec,arr);\n  /* Tam odendiyse teslim tarihi odeme gunune cekilir */\n  if(isFullyPaid(rec))rec.teslimTarihi=pay.tarih;\n  executeQuickPaySave(rec);\n}\nfunction executeQuickPaySave(rec){\n  toast('Tahsilat i\\u015fleniyor...',true);\n  saveRecordToServer(rec,function(){\n    saveLocal();updateAllViews();toast('\\u2705 Tahsilat kaydedildi!',true);closeDetailModal();closeQuickPay();\n  });\n}\nfunction deleteRecord(id){\n  if(!confirm('Bu sipariş çöp kutusuna taşınsın mı?'))return;\n  var rec=records.find(function(r){return r.id===id;});if(!rec)return;\n  rec.deleted=true;rec.deletedAt=new Date().toISOString();toast('Çöp kutusuna taşınıyor...',true);\n  saveRecordToServer(rec,function(){saveLocal();updateAllViews();closeDetailModal();toast('Çöp kutusuna taşındı',true);});\n}\n\n/* ═══ EXPORT ═══ */\nfunction openExportModal(){document.getElementById('exportCount').textContent=getActiveRecords().length+' sipariş dışa aktarılacak';selectExport('csv');document.getElementById('exportOverlay').classList.add('open');}\nfunction closeExportModal(e){if(!e||e.target===document.getElementById('exportOverlay'))document.getElementById('exportOverlay').classList.remove('open');}\nfunction selectExport(fmt){exportFormat=fmt;document.getElementById('opt-csv').classList.toggle('selected',fmt==='csv');document.getElementById('opt-xlsx').classList.toggle('selected',fmt==='xlsx');}\nfunction doExport(){if(!getActiveRecords().length){toast('Dışa aktarılacak kayıt yok');return;}closeExportModal();exportFormat==='xlsx'?exportExcel():exportCSV();}\n\nvar HEADER=['No','Ad Soyad','Telefon','E-Posta','Sipariş Tarihi','Teslim Tarihi','Satış Temsilcisi','Uzak R Sph','Uzak R Cyl','Uzak R Ax','Uzak R Pdm','Uzak R Yük','Uzak R Not','Uzak L Sph','Uzak L Cyl','Uzak L Ax','Uzak L Pdm','Uzak L Yük','Uzak L Not','Yakın R Sph','Yakın R Cyl','Yakın R Ax','Yakın R Pdm','Yakın R Yük','Yakın R Not','Yakın L Sph','Yakın L Cyl','Yakın L Ax','Yakın L Pdm','Yakın L Yük','Yakın L Not','Tutar','Kapora','Bakiye','Tahsilat Tarihi','Üretim Durumu','Ürünler','TC/Vergi No','Pipedrive','Nebim'];\nfunction buildRow(r){var rxV=RX_IDS.map(function(f){return(r.rx&&r.rx[f])?r.rx[f]:'';});var uL=(r.products||[]).map(function(p){var ad=getProdAdet(p);return(ad>1?ad+'× ':'')+p.urun+(p.ekartman?' ['+p.ekartman+'-'+(p.kopru||'')+'-'+(p.kol||'')+']':'')+(p.kategori?' · '+p.kategori:'')+(p.fiyat?' - '+p.fiyat+' ₺':'');}).join(' | ');return[r.no,r.adSoyad,r.telefon,r.eposta,r.siparisTarihi,r.teslimTarihi,r.satisTem].concat(rxV).concat([r.tutar,r.kapora,r.bakiye,r.bakiyeTarih||'',r.siparisDurumu||'Satış Yapıldı',uL,r.tcVergi,r.recPipedrive?'Evet':'Hayır',r.recNebim?'Evet':'Hayır']);}\nfunction exportCSV(){var rows=getActiveRecords().map(function(r){return buildRow(r).map(function(v){return'\"'+(v||'').replace(/\"/g,'\"\"')+'\"';});});var csv=[HEADER].concat(rows).map(function(r){return r.join(',');}).join('\\n');dl('\\ufeff'+csv,'text/csv;charset=utf-8','damlakuz_'+getLocalTodayStr()+'.csv');toast('📄 CSV indirildi');}\nfunction exportExcel(){if(typeof XLSX==='undefined'){toast('⏳ SheetJS yükleniyor, lütfen tekrar dene',false);return;}var data=[HEADER].concat(getActiveRecords().map(buildRow));var ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=HEADER.map(function(_,i){return{wch:Math.max(12,...data.map(function(row){return(row[i]||'').toString().length;}))};});var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siparişler');XLSX.writeFile(wb,'damlakuz_'+getLocalTodayStr()+'.xlsx');toast('📊 Excel indirildi');}\n\nfunction generateNo(){var d=new Date(),y=d.getFullYear().toString().slice(-2),m=String(d.getMonth()+1).padStart(2,'0'),px='DK-'+m+'-'+y+'-',mx=0;records.forEach(function(r){if(r.no&&r.no.startsWith(px)){var ps=r.no.split('-'),nm=parseInt(ps[ps.length-1],10);if(!isNaN(nm)&&nm>mx)mx=nm;}});return px+String(mx+1).padStart(4,'0');}\nfunction formatDate(d){if(!d)return'';var p=String(d).split('-');if(p.length===3)return p[2]+'.'+p[1]+'.'+p[0];return d;}\nfunction dl(content,mime,name){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();}\n/* Form girişinde kuruş desteği:\n   - Rakam, nokta ve virgül kabul edilir\n   - Bir tane virgül: ondalık ayraç. Virgülden sonra max 2 basamak.\n   - Tam sayı kısmında binlik nokta otomatik eklenir. */\nfunction formatCurrency(el){\n  if(!el.value){calcBalance();return;}\n  var raw=String(el.value).replace(/[^0-9.,]/g,'');\n  var commaIdx=raw.indexOf(',');\n  if(commaIdx>-1){\n    var intPart=raw.substring(0,commaIdx).replace(/\\./g,'');\n    var decPart=raw.substring(commaIdx+1).replace(/[.,]/g,'').substring(0,2);\n    if(intPart==='')intPart='0';\n    var intNum=parseInt(intPart,10);\n    if(isNaN(intNum))intNum=0;\n    el.value=intNum.toLocaleString('tr-TR')+','+decPart;\n  }else{\n    var digits=raw.replace(/\\./g,'');\n    if(digits===''){el.value='';}else{\n      var n=parseInt(digits,10);\n      if(isNaN(n))n=0;\n      el.value=n.toLocaleString('tr-TR');\n    }\n  }\n  calcBalance();\n}\nfunction calcBalance(){updatePaymentTotals();}\n\n/* ═══ SENKRON KUYRUGU ═══\n   Sunucuya gidemeyen kayitlar localStorage'da bekler, tekrar denenir. */\nfunction getSyncQueue(){try{return JSON.parse(localStorage.getItem('dk_sync_queue')||'[]');}catch(e){return[];}}\nfunction setSyncQueue(q){try{localStorage.setItem('dk_sync_queue',JSON.stringify(q));}catch(e){}updateSyncBanner();}\nfunction queueRecord(rec){\n  var q=getSyncQueue();\n  q=q.filter(function(r){return r.id!==rec.id;});\n  q.push(rec);\n  setSyncQueue(q);\n}\nfunction unqueueRecord(id){setSyncQueue(getSyncQueue().filter(function(r){return r.id!==id;}));}\nfunction updateSyncBanner(){\n  var b=document.getElementById('syncBanner');if(!b)return;\n  var n=getSyncQueue().length;\n  var c=document.getElementById('syncCount');if(c)c.textContent=n;\n  if(n>0)b.classList.add('show');else b.classList.remove('show');\n}\n/* Tum kayit yazma islemleri buradan gecer: hata olursa kuyruga alinir */\nfunction saveRecordToServer(rec,onOk){\n  if(typeof google!=='undefined'&&google.script){\n    google.script.run\n      .withSuccessHandler(function(){unqueueRecord(rec.id);if(onOk)onOk();})\n      .withFailureHandler(function(err){\n        console.error(err);\n        queueRecord(rec);\n        toast('\\u26a0\\ufe0f Sunucuya kaydedilemedi, kuyruga alindi',false);\n        if(onOk)onOk();\n      })\n      .saveOrderData(rec);\n  }else{if(onOk)onOk();}\n}\nfunction retrySyncQueue(){\n  var q=getSyncQueue();\n  if(!q.length){toast('Bekleyen kay\\u0131t yok',true);return;}\n  if(typeof google==='undefined'||!google.script){toast('Sunucu ba\\u011flant\\u0131s\\u0131 yok',false);return;}\n  toast('Kuyruk g\\u00f6nderiliyor...',true);\n  var remaining=q.length,failed=0;\n  q.forEach(function(rec){\n    google.script.run\n      .withSuccessHandler(function(){\n        unqueueRecord(rec.id);remaining--;\n        if(remaining===0)toast(failed?('\\u26a0\\ufe0f '+failed+' kay\\u0131t hala g\\u00f6nderilemedi'):'\\u2705 Kuyruk temizlendi',!failed);\n      })\n      .withFailureHandler(function(){\n        failed++;remaining--;\n        if(remaining===0)toast('\\u26a0\\ufe0f '+failed+' kay\\u0131t hala g\\u00f6nderilemedi',false);\n      })\n      .saveOrderData(rec);\n  });\n}\n\n/* ═══ PICKER — kategori ve adet desteği eklendi ═══ */\nfunction openPicker(title,options,targetId,type){\n  document.getElementById('pickerTitle').textContent=title;\n  activePickerTarget=targetId;\n  activePickerType=type||'generic';\n  var grid=document.getElementById('pickerGrid');\n  var cv=document.getElementById(targetId).value;\n\n  if(activePickerType==='category'){\n    grid.className='picker-grid cat-grid';\n    grid.innerHTML=CATEGORIES.map(function(c){\n      var iconHtml=c.iconType==='svg'?('\u003cspan class=\"cat-icon-svg\">'+c.icon+'\u003c/span>'):('\u003cspan class=\"cat-icon\">'+c.icon+'\u003c/span>');\n      var safeName=c.name.replace(/'/g,\"\\\\'\");\n      return '\u003cdiv class=\"picker-opt'+(c.name===cv?' active':'')+'\" onclick=\"selPickerVal(\\''+safeName+'\\')\">'+iconHtml+'\u003cspan class=\"cat-name\">'+c.name+'\u003c/span>\u003cspan class=\"cat-vat\">%'+c.vat+' KDV\u003c/span>\u003c/div>';\n    }).join('');\n  }else if(activePickerType==='adet'){\n    grid.className='picker-grid adet-grid';\n    /* Mevcut değer 11+ ise \"10+\" butonu aktif gözüksün */\n    var currentN=parseInt((cv||'').replace(/[^0-9]/g,''),10);\n    var isCustom=!isNaN(currentN)&&currentN>10;\n    grid.innerHTML=ADET_OPTIONS.map(function(opt){\n      var isActive=(opt==='10+')?isCustom:(opt===cv);\n      var label=opt;\n      if(opt==='10+'&&isCustom)label=String(currentN);\n      return '\u003cdiv class=\"picker-opt'+(isActive?' active':'')+'\" onclick=\"selAdetVal(\\''+opt+'\\')\">'+label+'\u003c/div>';\n    }).join('');\n  }else{\n    grid.className=title.toUpperCase().includes('AX')?'picker-grid ax-grid':'picker-grid';\n    grid.innerHTML=options.map(function(opt){return'\u003cdiv class=\"picker-opt'+(opt===cv?' active':'')+'\" onclick=\"selPickerVal(\\''+opt+'\\')\">'+opt+'\u003c/div>';}).join('');\n  }\n  document.getElementById('pickerOverlay').classList.add('open');\n}\nfunction selAdetVal(val){\n  if(val==='10+'){\n    var input=prompt('Adet kaç olacak? (11 veya üstü)','11');\n    if(input===null){closePickerModal();return;}\n    var n=parseInt(input.replace(/[^0-9]/g,''),10);\n    if(isNaN(n)||n\u003c1)n=1;\n    if(activePickerTarget)document.getElementById(activePickerTarget).value=String(n);\n  }else{\n    if(activePickerTarget)document.getElementById(activePickerTarget).value=val;\n  }\n  closePickerModal();\n  calcSubtotal();\n}\nfunction selPickerVal(val){if(activePickerTarget)document.getElementById(activePickerTarget).value=val;closePickerModal();}\nfunction clearPicker(){\n  if(activePickerTarget){\n    /* Adet için varsayılan 1, diğerleri için boş */\n    if(activePickerType==='adet')document.getElementById(activePickerTarget).value='1';\n    else document.getElementById(activePickerTarget).value='';\n  }\n  closePickerModal();\n  if(activePickerType==='adet')calcSubtotal();\n}\nfunction closePickerModal(e){if(!e||e.target.id==='pickerOverlay'||!e.target){document.getElementById('pickerOverlay').classList.remove('open');activePickerTarget=null;activePickerType='generic';}}\n\nfunction selBank(el,val){document.querySelectorAll('#bankGrid .cc-opt').forEach(function(n){n.classList.remove('active');});el.classList.add('active');document.getElementById('ccBank').value=val;}\nfunction selTaksit(el,val){document.querySelectorAll('#taksitGrid .cc-opt').forEach(function(n){n.classList.remove('active');});el.classList.add('active');document.getElementById('ccTaksit').value=val;}\nfunction resetCCModal(){document.querySelectorAll('.modal .cc-opt').forEach(function(n){n.classList.remove('active');});document.getElementById('ccBank').value='';document.getElementById('ccTaksit').value='';}\n/* Chipler artik salt-goruntu; odeme yontemi sadece tahsilat modalindan girilir. */\nfunction toggleRec(key,chipId,cb){payState[key]=cb.checked;var el=document.getElementById(chipId);el.className='rec-chip'+(cb.checked?' sel-chk':'');}\nfunction saveCCModal(){\n  var bank=document.getElementById('ccBank').value,taksit=document.getElementById('ccTaksit').value;\n  if(!bank||!taksit){toast('L\\u00fctfen banka ve taksit se\\u00e7in',false);return;}\n  var text=bank+' '+taksit;\n  document.getElementById('ccOverlay').classList.remove('open');\n  if(quickPayMode){\n    var amt=parseTRMoney(document.getElementById('qpTutar').value);\n    var tarih=document.getElementById('qpTarih').value||getLocalTodayStr();\n    quickPayMode=false;\n    commitPayment({tutar:formatMoneyAuto(amt),tarih:tarih,yontem:'kk',ccDetail:text});\n    return;\n  }\n}\nfunction cancelCCModal(){document.getElementById('ccOverlay').classList.remove('open');quickPayMode=false;}\nfunction closeCCModal(e){if(!e||e.target===document.getElementById('ccOverlay'))cancelCCModal();}\nfunction resetPayChips(){\n  Object.keys(payState).forEach(function(k){payState[k]=false;});\n  ccDetails.kaporaKK='';ccDetails.bakiyeKK='';\n  var cn=document.getElementById('chip-kn');if(cn)cn.className='pay-chip pay-chip-ro';\n  var ck=document.getElementById('chip-kk');if(ck){ck.className='pay-chip pay-chip-ro';ck.textContent='\\ud83d\\udcb3 K.Kart\\u0131';}\n  var nb=document.getElementById('chip-nb');if(nb){nb.className='rec-chip';var c2=nb.querySelector('input');if(c2)c2.checked=false;}\n  var pl=document.getElementById('paymentList');if(pl)pl.innerHTML='';\n}\nfunction confirmClear(){if(confirm('Form temizlensin mi?'))newForm();}\nfunction toast(msg,ok){ok=ok!==false;var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(ok?' ok':'');setTimeout(function(){t.className='toast';},2400);}\n\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js\">\u003c/script>\n\u003c/body>\n\u003c/html>";

 if(input.group==='Kredi kartı ekstresi'&&!input.cardAccount)throw Error('CARD_REQUIRED');

function bridgeScript(nonce){
 return '<script>(function(){const token='+JSON.stringify(nonce)+';window.addEventListener("message",function(e){if(e.source!==parent||!e.data||e.data.type!=="kuzmos-add-product"||e.data.nonce!==token)return;const p=e.data.product;if(!p||!["urun","ekartman","kopru","kol","kategori","fiyat","sku"].every(k=>typeof p[k]==="string"&&p[k].length<200))return;let row=[...document.querySelectorAll("#productRows .product-row")].find(r=>!r.querySelector("input").value.trim());if(!row){addProductRow();row=document.querySelector("#productRows .product-row:last-child")}const inputs=row.querySelectorAll("input");[p.urun,"1",p.ekartman,p.kopru,p.kol,p.kategori,p.fiyat].forEach((v,i)=>{if(inputs[i])inputs[i].value=v});row.dataset.kuzmosSku=p.sku;calcSubtotal();parent.postMessage({type:"kuzmos-product-added",nonce:token,sku:p.sku},"*")});parent.postMessage({type:"kuzmos-staff-ready",nonce:token},"*")})();<\/script>';
}

window.addEventListener('message',staffMessage);

 form.addEventListener('submit',e=>{e.preventDefault();safely(()=>{takeDraft();const next=structuredClone(paymentStore),id='OD-'+(Math.max(1007,...next.records.map(x=>Number(x.id.slice(3))))+1);const amount=parseTL(draft.amount);

 paymentStore=next;detailId=id;financeView='calendar';message=paymentMode==='plan'?'Ödeme planlandı. Vadesinde açıp ödendi onayı verebilirsiniz.':'Ödeme kaydedildi. Hesap hareketi oluşturuldu.';draft={group:'Tedarikçi',payeeId:'',methodId:'',plannedAccount:'',amount:'',due:demoDay,actualDate:demoDay};render();})});

function monthCalendar(){const grid=monthDays(calendarMonth);let rows=paymentStore.records.filter(p=>!p.cancelled&&p.due.startsWith(calendarMonth));return panel('Ödeme takvimi','<div class="kp-detail"><label>Ay<input id="kp-calendar-month" type="month" value="'+calendarMonth+'"></label></div><div class="kp-calendar">'+['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>'<strong>'+d+'</strong>').join('')+Array.from({length:grid.offset},()=>'<div></div>').join('')+grid.days.map(d=>{const day=rows.filter(p=>p.due===d),remaining=day.reduce((s,p)=>s+paymentRemaining(p),0);return '<button data-calendar-day="'+d+'" aria-pressed="'+(d===calendarDay)+'"><strong>'+Number(d.slice(8))+'</strong>'+(day.length?'<span>'+day.length+' ödeme</span><small>'+money(remaining)+'</small>':'')+'</button>'}).join('')+'</div>'+ (calendarDay?'<div class="kp-detail"><button id="kp-calendar-clear">Ayın tamamını göster</button></div>':'')+paymentTable(rows.filter(p=>!calendarDay||p.due===calendarDay)));}
