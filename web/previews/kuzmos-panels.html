\u003cb style=\"color:#1d1d1f;font-weight:600\">güzel görüşler\u003c/b> dileriz.\u003c/div>'+\n     '\u003c/td>\u003c/tr>';\n  h+='\u003ctr>\u003ctd style=\"padding:28px 30px 0\">'+\n     '\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border:1px solid #ead9a6;border-radius:10px;background:#fffcf0\">\u003ctr>\u003ctd style=\"padding:20px 22px\">'+\n     '\u003cdiv style=\"font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#9a7f00\">YARIM ASIRDAN FAZLA\u003c/div>'+\n     '\u003cdiv style=\"font-size:13px;color:#6e6e73;line-height:1.75;margin-top:9px\">\u003cb style=\"color:#1d1d1f;font-weight:600\">Fahri Kuz\u003c/b>\\'un Yenikapı\\'da açtığı ilk mağaza ile başlayan serüven, Türkiye\\'nin ilk optik zincirini oluşturan Kuz Optik ile devam etti. Organik ve çok odaklı camlar ile titanyum çerçevelerin Türkiye\\'ye getirilmesi başta olmak üzere optik alanındaki birçok ilke imza attık.\u003cbr>\u003cbr>Bugün de aynı yerdeyiz: kaliteden ödün vermeden. Siz de artık bu hikâyenin bir parçasısınız.\u003c/div>'+\n     '\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>';\n  h+='\u003ctr>\u003ctd style=\"padding:28px 30px 0\">'+mailSectionTitle('YENİ GÖZLÜĞÜNÜZE ALIŞIRKEN')+\n     '\u003cdiv style=\"font-size:13px;color:#6e6e73;line-height:1.8;padding-top:11px\">'+\n     '· İlk günlerde gözlüğünüzü \u003cb style=\"color:#1d1d1f;font-weight:600\">gün boyu takın\u003c/b>, sık sık çıkarıp takmayın — gözünüz yeni camlara böyle daha hızlı uyum sağlar.\u003cbr>'+\n     '· Çok odaklı (progresif) cam kullanıyorsanız merdivende \u003cb style=\"color:#1d1d1f;font-weight:600\">başınızı hafifçe öne eğip\u003c/b> camın uzak bölgesinden bakın; uyum genellikle birkaç gün sürer.\u003cbr>'+\n     '· Gözlüğünüzü camları yukarı bakacak şekilde bırakmayın, \u003cb style=\"color:#1d1d1f;font-weight:600\">kılıfında\u003c/b> saklayın.'+\n     '\u003c/div>\u003c/td>\u003c/tr>';\n  h+='\u003ctr>\u003ctd style=\"padding:26px 30px 0\">'+\n     '\u003cdiv style=\"font-size:13px;color:#6e6e73;line-height:1.75;border-top:1px solid #e8e8ed;padding-top:18px\">Reçeteniz kayıtlarımızda saklıdır. \u003cb style=\"color:#1d1d1f;font-weight:600\">Altı ayda bir kez göz muayenesi\u003c/b> öneririz; gözlükleriniz de elbiseleriniz gibidir, arada bir ütü ister — dilediğiniz zaman bizlere uğrayıp \u003cb style=\"color:#1d1d1f;font-weight:600\">ömür boyu ücretsiz bakım\u003c/b> hizmetimizden faydalanabilirsiniz.\u003c/div>\u003c/td>\u003c/tr>';\n  h+='\u003ctr>\u003ctd style=\"padding:24px 30px 0\">'+mailBtnRow('Bizi arayın',STORE.telHref,true,STORE.webAd,STORE.web)+'\u003c/td>\u003c/tr>';\n  h+=mailFoot(false);\n  return h;\n}\n\nfunction buildMail(rec,type){\n  var fn=(type==='hazir')?mail_hazir:(type==='tesekkur')?mail_tesekkur:mail_siparis;\n  var t=MAIL_TYPES[type]||MAIL_TYPES.siparis;\n  return {subject:t.subject(rec),html:fn(rec)};\n}\n\n/* ── Gönderim ── */\nfunction sendCustomerMail(rec,type,opts){\n  opts=opts||{};\n  var to=String(rec.eposta||'').trim();\n  if(!to){ if(!opts.silent)toast('Bu kayıtta e-posta adresi yok',false); if(opts.done)opts.done(false); return; }\n  if(typeof google==='undefined'||!google.script){ if(!opts.silent)toast('Sunucuya bağlanılamadı',false); if(opts.done)opts.done(false); return; }\n  var m=buildMail(rec,type);\n  if(!opts.silent)toast('Mail gönderiliyor...',true);\n  google.script.run\n    .withSuccessHandler(function(){\n      markMailSent(rec,type);\n      saveLocal();\n      saveRecordToServer(rec);\n      if(!opts.silent)toast('Mail gönderildi · '+to,true);\n      if(opts.done)opts.done(true);\n    })\n    .withFailureHandler(function(err){\n      var msg=(err&&err.message)?err.message:'Bilinmeyen hata';\n      if(!opts.silent)toast('Mail gönderilemedi: '+msg,false);\n      if(opts.done)opts.done(false);\n    })\n    .musteriyeMailGonder({to:to,subject:m.subject,html:m.html});\n}\n\n/* ── WhatsApp: teslimata hazır metni ── */\nfunction waReadyText(rec){\n  return 'Sayın '+(rec.adSoyad||'')+',\\n\\n'+(rec.no||'')+' numaralı siparişiniz teslimata hazırdır. Mağazamızdan dilediğiniz zaman teslim alabilirsiniz.\\n\\n'+\n  '📍 '+STORE.adresKisa+'\\n☎ '+STORE.tel+'\\n'+STORE.web+'\\n\\n'+STORE.ad+' güzel görüşler, iyi günler diler.';\n}\nfunction openWaReady(rec){\n  var p=String(rec.telefon||'');\n  if(!p.trim()){toast('Telefon kayıtlı değil!',false);return;}\n  var c=p.replace(/\\D/g,'');\n  if(c.startsWith('0'))c=c.substring(1);\n  if(c.length===10)c='90'+c;\n  window.open('https://wa.me/'+c+'?text='+encodeURIComponent(waReadyText(rec)),'_blank');\n}\n\n/* ── Durum değişiminde çıkan onay kutusu ── */\nfunction showNotifyCard(rec,mailOk){\n  var ov=document.getElementById('notifyOverlay');\n  if(!ov){\n    ov=document.createElement('div');\n    ov.id='notifyOverlay';\n    ov.className='notify-overlay';\n    ov.onclick=function(e){if(e.target===ov)closeNotifyCard();};\n    document.body.appendChild(ov);\n  }\n  var to=String(rec.eposta||'').trim();\n  var line;\n  if(mailOk===true)line='Teslimata hazır maili \u003cb>'+esc(to)+'\u003c/b> adresine gönderildi.';\n  else if(mailOk===false)line='\u003cspan style=\"color:var(--red)\">Mail gönderilemedi.\u003c/span> Kayıt detayından “Mail İlet” ile tekrar deneyebilirsin.';\n  else line='Bu kayıtta e-posta adresi yok, mail gönderilmedi.';\n  var hasTel=!!String(rec.telefon||'').trim();\n  ov.innerHTML='\u003cdiv class=\"notify-card\">'+\n    '\u003cdiv class=\"notify-ico\">✓\u003c/div>'+\n    '\u003cdiv class=\"notify-t\">'+esc(rec.adSoyad||'Müşteri')+' bilgilendirildi\u003c/div>'+\n    '\u003cdiv class=\"notify-s\">'+line+'\u003cbr>'+(hasTel?'WhatsApp mesajı hazır — göndermek için tıkla.':'Telefon kayıtlı değil, WhatsApp gönderilemez.')+'\u003c/div>'+\n    '\u003cdiv class=\"notify-btns\">'+\n      '\u003cbutton class=\"btn btn-outline btn-sm\" onclick=\"closeNotifyCard()\">Şimdi değil\u003c/button>'+\n      (hasTel?'\u003cbutton class=\"btn btn-wa-solid btn-sm\" id=\"notifyWaBtn\">WhatsApp\\'tan gönder\u003c/button>':'')+\n    '\u003c/div>\u003c/div>';\n  if(hasTel){\n    document.getElementById('notifyWaBtn').onclick=function(){openWaReady(rec);closeNotifyCard();};\n  }\n  ov.classList.add('open');\n}\nfunction closeNotifyCard(){\n  var ov=document.getElementById('notifyOverlay');\n  if(ov)ov.classList.remove('open');\n}\n\n/* ── Otomatik tetikleyici ── */\nfunction maybeAutoNotify(rec,type){\n  try{\n    if(!autoNotifyEligible(rec))return;\n    if(getMailSent(rec)[type])return;\n    var hasMail=!!String(rec.eposta||'').trim();\n    if(type==='hazir'){\n      if(hasMail)sendCustomerMail(rec,'hazir',{silent:true,done:function(ok){showNotifyCard(rec,ok);}});\n      else showNotifyCard(rec,null);\n      return;\n    }\n    if(hasMail)sendCustomerMail(rec,type,{silent:false});\n  }catch(e){}\n}\n\nfunction sendWhatsApp(phone,adSoyad,siparisNo){var p=String(phone||'');if(!p.trim()){toast('Telefon kayıtlı değil!',false);return;}var c=p.replace(/\\D/g,'');if(c.startsWith('0'))c=c.substring(1);if(c.length===10)c='90'+c;window.open('https://wa.me/'+c+'?text='+encodeURIComponent('Sayın '+adSoyad+', '+siparisNo+' numaralı siparişiniz teslimata hazırdır. Damla Kuz Optik güzel görüşler, iyi günler diler.'),'_blank');}\nfunction openWhatsAppBlank(phone){var p=String(phone||'');if(!p.trim()){toast('Telefon kayıtlı değil!',false);return;}var c=p.replace(/\\D/g,'');if(c.startsWith('0'))c=c.substring(1);if(c.length===10)c='90'+c;window.open('https://wa.me/'+c,'_blank');}\nfunction handleCustomerSearch(){clearTimeout(customerSearchTimeout);customerSearchTimeout=setTimeout(renderCustomers,300);}\n\nfunction renderCustomers(){\n  var q=(document.getElementById('searchCustomerInput').value||'').toLowerCase(),customers=getUniqueCustomers();\n  var filtered=customers.filter(function(c){return c.adSoyad.toLowerCase().includes(q)||(c.telefon||'').includes(q);});\n  filtered.sort(function(a,b){return b.totalSpent-a.totalSpent;});\n  var list=document.getElementById('customerList');\n  if(!filtered.length){list.innerHTML='\u003cdiv class=\"empty-state\">\u003cdiv class=\"icon\">👥\u003c/div>\u003cp>Müşteri bulunamadı.\u003c/p>\u003c/div>';return;}\n  var html='';\n  filtered.forEach(function(c,idx){var waBtn=c.telefon?'\u003cbutton class=\"btn btn-wa btn-sm\" onclick=\"event.stopPropagation();openWhatsAppBlank(\\''+c.telefon+'\\')\" style=\"padding:6px 10px;font-size:12px;font-weight:600\">💬 WA\u003c/button>':'';html+='\u003cdiv class=\"record-card\" onclick=\"openCustomerDetail('+idx+')\">\u003cdiv class=\"record-info\">\u003cdiv class=\"record-name\">'+c.adSoyad+'\u003c/div>\u003cdiv class=\"record-meta\">'+(c.telefon?'\u003cspan>📞 '+c.telefon+'\u003c/span>':'')+'\u003cspan>🛒 '+c.orderCount+' Sipariş\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"record-amount\">'+waBtn+'\u003c/div>\u003c/div>';});\n  window.currentCustomerList=filtered;list.innerHTML=html;\n}\nfunction openCustomerDetail(idx){\n  var c=window.currentCustomerList[idx];if(!c)return;\n  document.getElementById('cmTitle').textContent=c.adSoyad;document.getElementById('cmSub').textContent=(c.telefon||'Telefon yok')+(c.eposta?' · '+c.eposta:'');\n  document.getElementById('cmTotalSpent').textContent=formatMoney(c.totalSpent)+' ₺';document.getElementById('cmOrderCount').textContent=c.orderCount;\n  var dp=(c.totalAraToplam>0&&c.totalSpent\u003cc.totalAraToplam)?Math.round(((c.totalAraToplam-c.totalSpent)/c.totalAraToplam)*100):0;document.getElementById('cmAvgDiscount').textContent='%'+dp;\n  var oh='';c.orders.sort(function(a,b){return new Date(b.siparisTarihi)-new Date(a.siparisTarihi);}).forEach(function(o){var uList=(o.products||[]).map(function(p){return p.urun;}).filter(Boolean).join(', ')||'Ürün belirtilmemiş';var rep=o.satisTem||'Bilinmiyor';oh+='\u003cdiv class=\"c-order-item\" onclick=\"closeCustomerModal();openDetailModal(\\''+o.id+'\\')\">\u003cdiv>\u003cdiv class=\"c-order-date\">'+formatDate(o.siparisTarihi)+' · #'+o.no+' \u003cspan style=\"margin-left:6px;background:var(--gray-200);padding:2px 6px;border-radius:4px;font-size:10px;color:var(--gray-600);font-weight:600\">👤 '+rep+'\u003c/span>\u003c/div>\u003cdiv class=\"c-order-prods\">'+uList+'\u003c/div>\u003c/div>\u003cdiv class=\"c-order-total\">'+formatMoney(o.tutar)+' ₺\u003c/div>\u003c/div>';});\n  document.getElementById('cmOrdersList').innerHTML=oh;document.getElementById('customerDetailOverlay').classList.add('open');\n}\nfunction closeCustomerModal(e){if(!e||e.target===document.getElementById('customerDetailOverlay')||e.target.closest&&e.target.closest('.btn-outline'))document.getElementById('customerDetailOverlay').classList.remove('open');}\n\nfunction calcSubtotal(){\n  formDirty=true;\n  var nodes=document.querySelectorAll('#productRows .product-row'),at=0;\n  for(var i=0;i\u003cnodes.length;i++){\n    var inps=nodes[i].querySelectorAll('input');\n    /* inps[0]=urun, inps[1]=adet, inps[2..4]=ekar/kop/kol, inps[5]=kategori, inps[6]=fiyat */\n    var adetVal=parseInt((inps[1].value||'').replace(/[^0-9]/g,''),10);\n    if(isNaN(adetVal)||adetVal\u003c1)adetVal=1;\n    var fiyatVal=parseTRMoney(inps[6].value);\n    at+=fiyatVal*adetVal;\n  }\n  document.getElementById('lblAraToplam').textContent=formatMoney(at)+' ₺';\n  var te=document.getElementById('tutar');if(te.dataset.manual!=='true'||te.value===''){te.value=at>0?formatMoney(at):'';}\n  calcDiscount();calcBalance();\n}\nfunction handleTotalInput(el){formatCurrency(el);el.dataset.manual=(el.value!=='')?'true':'false';if(el.value==='')calcSubtotal();calcDiscount();}\nfunction calcDiscount(){\n  var at=parseTRMoney(document.getElementById('lblAraToplam').textContent),tt=parseTRMoney(document.getElementById('tutar').value),lbl=document.getElementById('lblIndirim');\n  if(at>0&&tt\u003cat&&tt>0){var f=at-tt,y=Math.round((f/at)*100);lbl.textContent='İNDİRİM: '+formatMoney(f)+' ₺ (%'+y+')';lbl.style.display='inline';}else{lbl.style.display='none';}\n}\n\u003c/script>\n\u003cscript>\n/* ═══ KOMİSYON HESABI ═══ */\n/* Banka komisyon oranları (taksit bazlı). \"Diğer\" = %14.49 (en yüksek). */\nconst KK_COMMISSION_RATES={\n  'Tek çekim':3.5,\n  '2 Taksit':7,\n  '3 Taksit':9,\n  '4 Taksit':10.69,\n  '5 Taksit':12.49,\n  '6 Taksit':14.49,\n  'Diğer':14.49\n};\n/* ccDetails string'inden (\"Garanti 3 Taksit\" gibi) komisyon oranı çıkar. */\nfunction getCommissionRate(ccString){\n  if(!ccString)return 0;\n  var s=String(ccString);\n  /* En spesifikten genele: önce \"Tek çekim\" sonra \"N Taksit\" sonra \"Diğer\". */\n  if(s.indexOf('Tek çekim')>-1)return KK_COMMISSION_RATES['Tek çekim'];\n  for(var i=6;i>=2;i--){if(s.indexOf(i+' Taksit')>-1)return KK_COMMISSION_RATES[i+' Taksit'];}\n  if(s.indexOf('Diğer')>-1)return KK_COMMISSION_RATES['Diğer'];\n  return 0;\n}\n\n/* Bir kayıt için belirli aydaki tahsilat detayı:\n   - Kapora: r.siparisTarihi ayında tahsil edilmiş sayılır\n   - Bakiye: bakiyeNakit/bakiyeKK işaretliyse bakiyeTarih (yoksa siparisTarihi) ayında tahsil edilmiş sayılır\n   monthStr 'YYYY-MM' formatında. monthStr null ise tüm zamanları getir.\n   Geri dönüş: { kasa, kdv, komisyon, kapora, bakiye, kaporaNakit, kaporaKK, bakiyeNakit, bakiyeKK }\n*/\nfunction getRecordCashflow(rec,monthStr){\n  var payments=getPayments(rec);\n  var kasa=0,kom=0;\n  var rep=(rec.satisTem||'').trim();\n  var primOran=(rep==='Fahri Can')?0:4.5;\n  payments.forEach(function(p){\n    var amt=parseTRMoney(p.tutar);\n    if(amt\u003c=0)return;\n    var d=String(p.tarih||'');\n    /* monthStr verilmisse sadece o aya dusen odemeler; yoksa tumu */\n    if(monthStr){\n      if(!d||d.substring(0,7)!==monthStr)return;\n    }\n    kasa+=amt;\n    /* 1) Banka komisyonu: sadece KK odemelerde, kendi taksit oranindan */\n    kom+=paymentCommission(p);\n    /* 2) Personel primi: tum tahsilattan %4.5 (Fahri Can haric) */\n    if(primOran>0)kom+=amt*(primOran/100);\n  });\n  /* KDV: kasaya girenin urun kategorilerine gore orantili KDV payi */\n  var netRatio=netRatioFor(rec);\n  var kdv=kasa*(1-netRatio);\n  if(kdv\u003c0)kdv=0;\n  var net=kasa-kdv-kom;\n  return {kasa:kasa,kdv:kdv,komisyon:kom,net:net,payments:payments};\n}\n\nfunction getRecordCashflowByCategory(rec,monthStr){\n  var cf=getRecordCashflow(rec,monthStr);\n  if(cf.kasa\u003c=0)return {};\n  var products=rec.products||[];\n  /* Her ürünün indirimli gross'unu (lineTotal × disc) bul. */\n  var araToplam=0;\n  products.forEach(function(p){araToplam+=getProdLineTotal(p);});\n  if(araToplam\u003c=0)return {};\n  var tutar=parseTRMoney(rec.tutar);\n  var disc=tutar/araToplam;if(!isFinite(disc)||disc\u003c0)disc=1;\n  /* Kategori bazında gross effective biriktir; her ürünün payını bul. Adet sayısı toplanır. */\n  var byCat={};\n  products.forEach(function(p){\n    var line=getProdLineTotal(p);\n    if(line\u003c=0)return;\n    var cat=p.kategori||'Diğer';\n    var grossEff=line*disc;\n    if(!byCat[cat])byCat[cat]={gross:0,count:0,vat:getCatVAT(p.kategori)};\n    byCat[cat].gross+=grossEff;\n    byCat[cat].count+=getProdAdet(p);\n  });\n  /* Toplam gross effective — bunu kasa toplamına oranla. */\n  var totalGross=0;Object.keys(byCat).forEach(function(k){totalGross+=byCat[k].gross;});\n  if(totalGross\u003c=0)return {};\n  /* Her kategoriye kasanın orantılı payını ver. */\n  var result={};\n  Object.keys(byCat).forEach(function(cat){\n    var pay=byCat[cat].gross/totalGross;\n    var catKasa=cf.kasa*pay;\n    var catKDV;\n    var vat=byCat[cat].vat;\n    if(vat===null||vat===undefined){\n      /* Diğer (kategorisiz) — KDV bilinmiyor, 0 say (ya da net ratio uygula). Net ratio yok.\n         Hesabı bozmamak için: KDV = catKasa × (1 - 1/(1+0.20)) gibi bir varsayım yapmıyoruz;\n         \"Diğer\" satırında KDV=0 göstereceğiz, kullanıcıya kategorisini doldurması gerektiği sinyali verilir. */\n      catKDV=0;\n    }else{\n      catKDV=catKasa*(1-1/(1+vat/100));\n    }\n    var catKom=cf.komisyon*pay; /* komisyonu da orantılı dağıt */\n    var catNet=catKasa-catKDV-catKom;\n    result[cat]={kasa:catKasa,kdv:catKDV,komisyon:catKom,net:catNet,count:byCat[cat].count};\n  });\n  return result;\n}\n\n/* ═══ DASHBOARD RENDER ═══\n   Aylık ve yıllık tablolar aynı şablondan üretilir. periodPredicate: bir kayıt\n   bu döneme dahil mi? cashflowFn: bir kayıt için kasa/kdv/komisyon/net üretir. */\n\n/* Personel agregasyon tablosu üreticisi.\n   İndirim ortalaması: ürün gross ağırlıklı (yıllık özet ve kategori tablosuyla tutarlı). */\nfunction aggregatePersonnel(records,monthStr){\n  var rs={};\n  records.forEach(function(r){\n    var rep=r.satisTem||'Belirtilmemiş';\n    var cf=getRecordCashflow(r,monthStr);\n    var sm=(r.siparisTarihi||'').substring(0,7);\n    /* Bu ay için: kapora/bakiye bu aya tahsil olduysa */\n    if(cf.kasa>0){\n      if(!rs[rep])rs[rep]={count:0,kasa:0,kdv:0,kom:0,net:0,iWeighted:0,iWeight:0};\n      rs[rep].kasa+=cf.kasa;\n      rs[rep].kdv+=cf.kdv;\n      rs[rep].kom+=cf.komisyon;\n      rs[rep].net+=cf.net;\n    }\n    /* Sipariş sayısı + indirim ağırlıklı toplama:\n       monthStr varsa o ayın yeni siparişleri; yoksa tüm yıl içindeki kayıtlar (zaten filtreli). */\n    var inPeriod=monthStr?(sm===monthStr):true;\n    if(inPeriod){\n      if(!rs[rep])rs[rep]={count:0,kasa:0,kdv:0,kom:0,net:0,iWeighted:0,iWeight:0};\n      rs[rep].count+=1;\n      var araToplam=0;(r.products||[]).forEach(function(p){araToplam+=getProdLineTotal(p);});\n      if(araToplam>0){\n        var t=parseTRMoney(r.tutar);\n        var iY=(t\u003caraToplam)?((araToplam-t)/araToplam)*100:0;\n        /* Ağırlıklı: indirim oranı × siparişin ürün gross toplamı */\n        rs[rep].iWeighted+=iY*araToplam;\n        rs[rep].iWeight+=araToplam;\n      }\n    }\n  });\n  return rs;\n}\n\n/* Kategori agregasyon tablosu üreticisi */\nfunction aggregateCategory(records,monthStr){\n  var catRows={};\n  /* İndirim ortalaması için kategori bazlı ayrı agregasyon (ürün gross ağırlıklı) */\n  var catDisc={};\n  records.forEach(function(r){\n    var cf=getRecordCashflow(r,monthStr);\n    if(cf.kasa>0){\n      var catFlow=getRecordCashflowByCategory(r,monthStr);\n      Object.keys(catFlow).forEach(function(cat){\n        var v=catFlow[cat];\n        if(!catRows[cat])catRows[cat]={kasa:0,kdv:0,kom:0,net:0,count:0};\n        catRows[cat].kasa+=v.kasa;\n        catRows[cat].kdv+=v.kdv;\n        catRows[cat].kom+=v.komisyon;\n        catRows[cat].net+=v.net;\n        catRows[cat].count+=v.count;\n      });\n    }\n    /* İndirim oranı sipariş bazlı; ürünlerin gross'u ile ağırlıklandırılır.\n       monthStr varsa: sadece sipariş tarihi o aya denk gelenler.\n       monthStr yoksa: tüm yıl içindeki kayıtlar (zaten filtreli geldiyse). */\n    var sm=(r.siparisTarihi||'').substring(0,7);\n    if(monthStr&&sm!==monthStr)return;\n    var araToplam=0;(r.products||[]).forEach(function(p){araToplam+=getProdLineTotal(p);});\n    if(araToplam\u003c=0)return;\n    var t=parseTRMoney(r.tutar);\n    var iY=(t\u003caraToplam)?((araToplam-t)/araToplam)*100:0;\n    (r.products||[]).forEach(function(p){\n      var line=getProdLineTotal(p);\n      if(line\u003c=0)return;\n      var cat=p.kategori||'Diğer';\n      if(!catDisc[cat])catDisc[cat]={weighted:0,weight:0};\n      catDisc[cat].weighted+=iY*line;\n      catDisc[cat].weight+=line;\n    });\n  });\n  return {rows:catRows,disc:catDisc};\n}\n\n/* Personel tablosu HTML üreticisi (aylık ve yıllık tek şablon) */\nfunction buildPersonnelTable(rs,emptyMsg){\n  var sortedR=Object.keys(rs).sort(function(a,b){return rs[b].kasa-rs[a].kasa;});\n  var pBody='',pTotals={count:0,kasa:0,kdv:0,kom:0,net:0,iWeighted:0,iWeight:0};\n  sortedR.forEach(function(rep){\n    var s=rs[rep];if(s.kasa===0&&s.count===0)return;\n    pTotals.count+=s.count;pTotals.kasa+=s.kasa;pTotals.kdv+=s.kdv;pTotals.kom+=s.kom;pTotals.net+=s.net;\n    pTotals.iWeighted+=s.iWeighted;pTotals.iWeight+=s.iWeight;\n    var netSepetOrt=s.count>0?(s.net/s.count):0;\n    var iAvg=s.iWeight>0?(s.iWeighted/s.iWeight):null;\n    var iCell=iAvg===null?'\u003cspan style=\"color:var(--gray-400);\">—\u003c/span>':'%'+Math.round(iAvg);\n    pBody+='\u003ctr>\u003ctd>\u003cdiv style=\"font-weight:600;color:var(--black);font-size:14px;\">'+rep+'\u003c/div>\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+s.count+'\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:600;\">'+formatMoneyNum(s.kasa)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(s.kdv)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(s.kom)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--black);font-weight:700;\">'+formatMoneyNum(s.net)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+formatMoneyNum(netSepetOrt)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+iCell+'\u003c/td>\u003c/tr>';\n  });\n  if(!pBody)pBody='\u003ctr>\u003ctd colspan=\"8\" style=\"text-align:center;color:var(--gray-400);padding:30px 10px;\">'+emptyMsg+'\u003c/td>\u003c/tr>';\n  var pNetSepetOrt=pTotals.count>0?(pTotals.net/pTotals.count):0;\n  var pIAvg=pTotals.iWeight>0?(pTotals.iWeighted/pTotals.iWeight):null;\n  var pICell=pIAvg===null?'—':'%'+Math.round(pIAvg);\n  var pFoot='\u003ctr>\u003ctd style=\"font-weight:700;text-transform:uppercase;font-size:11px;color:var(--gray-600);\">Toplam\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+pTotals.count+'\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:700;\">'+formatMoneyNum(pTotals.kasa)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(pTotals.kdv)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(pTotals.kom)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(pTotals.net)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(pNetSepetOrt)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+pICell+'\u003c/td>\u003c/tr>';\n  return '\u003ctable class=\"dash-table\">\u003cthead>\u003ctr>'+\n    '\u003cth style=\"text-align:left\">Personel\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Sipariş\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Kasa\u003c/th>'+\n    '\u003cth style=\"text-align:right\">KDV\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Komisyon\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net Sepet Ort\u003c/th>'+\n    '\u003cth style=\"text-align:right\">İndirim\u003c/th>'+\n    '\u003c/tr>\u003c/thead>\u003ctbody>'+pBody+'\u003c/tbody>\u003ctfoot>'+pFoot+'\u003c/tfoot>\u003c/table>';\n}\n\n/* Kategori tablosu HTML üreticisi (aylık ve yıllık tek şablon) */\nfunction buildCategoryTable(catData,emptyMsg){\n  var catRows=catData.rows,catDisc=catData.disc;\n  var catOrder=CATEGORIES.map(function(c){return c.name;});\n  var catKeys=Object.keys(catRows);\n  catKeys.sort(function(a,b){\n    var ai=catOrder.indexOf(a),bi=catOrder.indexOf(b);\n    if(ai===-1)ai=999;if(bi===-1)bi=999;\n    if(ai!==bi)return ai-bi;\n    return catRows[b].kasa-catRows[a].kasa;\n  });\n  var cBody='',cTotals={count:0,kasa:0,kdv:0,kom:0,net:0};\n  var cTotalsDisc={weighted:0,weight:0};\n  catKeys.forEach(function(cat){\n    var v=catRows[cat];if(v.kasa===0&&v.count===0)return;\n    cTotals.count+=v.count;cTotals.kasa+=v.kasa;cTotals.kdv+=v.kdv;cTotals.kom+=v.kom;cTotals.net+=v.net;\n    var d=catDisc[cat];\n    if(d){cTotalsDisc.weighted+=d.weighted;cTotalsDisc.weight+=d.weight;}\n    var netSepetOrt=v.count>0?(v.net/v.count):0;\n    var iAvg=(d&&d.weight>0)?(d.weighted/d.weight):null;\n    var iCell=iAvg===null?'\u003cspan style=\"color:var(--gray-400);\">—\u003c/span>':'%'+Math.round(iAvg);\n    var catDef=CATEGORIES.find(function(c){return c.name===cat;});\n    var iconHtml='';\n    if(catDef){\n      if(catDef.iconType==='svg')iconHtml='\u003cspan class=\"cat-icon-inline\">'+catDef.icon+'\u003c/span> ';\n      else iconHtml=catDef.icon+' ';\n    }\n    var catLabel=cat==='Diğer'?'\u003cspan style=\"color:var(--gray-400);font-style:italic;\">Diğer (kategorisiz)\u003c/span>':iconHtml+cat;\n    cBody+='\u003ctr>\u003ctd>\u003cdiv style=\"font-weight:600;color:var(--black);font-size:13px;display:flex;align-items:center;gap:4px;\">'+catLabel+'\u003c/div>\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+v.count+'\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:600;\">'+formatMoneyNum(v.kasa)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(v.kdv)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(v.kom)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--black);font-weight:700;\">'+formatMoneyNum(v.net)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+formatMoneyNum(netSepetOrt)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+iCell+'\u003c/td>\u003c/tr>';\n  });\n  if(!cBody)cBody='\u003ctr>\u003ctd colspan=\"8\" style=\"text-align:center;color:var(--gray-400);padding:30px 10px;\">'+emptyMsg+'\u003c/td>\u003c/tr>';\n  var cNetSepetOrt=cTotals.count>0?(cTotals.net/cTotals.count):0;\n  var cIAvg=cTotalsDisc.weight>0?(cTotalsDisc.weighted/cTotalsDisc.weight):null;\n  var cICell=cIAvg===null?'—':'%'+Math.round(cIAvg);\n  var cFoot='\u003ctr>\u003ctd style=\"font-weight:700;text-transform:uppercase;font-size:11px;color:var(--gray-600);\">Toplam\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+cTotals.count+'\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:700;\">'+formatMoneyNum(cTotals.kasa)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(cTotals.kdv)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(cTotals.kom)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(cTotals.net)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(cNetSepetOrt)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+cICell+'\u003c/td>\u003c/tr>';\n  return '\u003ctable class=\"dash-table\">\u003cthead>\u003ctr>'+\n    '\u003cth style=\"text-align:left\">Kategori\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Adet\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Kasa\u003c/th>'+\n    '\u003cth style=\"text-align:right\">KDV\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Komisyon\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net Sepet Ort\u003c/th>'+\n    '\u003cth style=\"text-align:right\">İndirim\u003c/th>'+\n    '\u003c/tr>\u003c/thead>\u003ctbody>'+cBody+'\u003c/tbody>\u003ctfoot>'+cFoot+'\u003c/tfoot>\u003c/table>';\n}\n\n/* Panel donem yardimcilari: periodOffset=0 bu ay, -1 onceki ay ... */\nfunction getPeriodMonth(){\n  var d=new Date();\n  d.setDate(1);\n  d.setMonth(d.getMonth()+periodOffset);\n  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');\n}\nfunction getPeriodYear(){return getPeriodMonth().substring(0,4);}\nfunction shiftPeriod(delta){periodOffset+=delta;renderDashboard();}\nfunction resetPeriod(){periodOffset=0;renderDashboard();}\nfunction updatePeriodNav(){\n  var ms=getPeriodMonth(),ay=AYLAR[parseInt(ms.split('-')[1],10)-1],yl=ms.substring(0,4);\n  var lbl=document.getElementById('periodLabel');\n  if(lbl)lbl.textContent=ay+' '+yl;\n  var nextBtn=document.getElementById('periodNext');\n  if(nextBtn)nextBtn.disabled=(periodOffset>=0);\n  var todayBtn=document.getElementById('periodToday');\n  if(todayBtn)todayBtn.disabled=(periodOffset===0);\n  var isCurrent=(periodOffset===0);\n  var lblCiro=document.getElementById('dashLblCiro'),lblKasa=document.getElementById('dashLblKasa');\n  if(lblCiro)lblCiro.textContent=isCurrent?'Bu Ay':ay;\n  if(lblKasa)lblKasa.textContent=isCurrent?'Bu Ay':ay;\n}\n\nfunction renderDashboard(){\n  var ms=getPeriodMonth(),ys=getPeriodYear();\n  var ay=AYLAR[parseInt(ms.split('-')[1],10)-1];\n  updatePeriodNav();\n  document.getElementById('dashMonthName1').textContent=ay;\n  document.getElementById('dashMonthName2').textContent=ay;\n  document.getElementById('dashMonthName4').textContent=ay;\n  document.getElementById('dashYearName').textContent=ys;\n  document.getElementById('dashYearName2').textContent=ys;\n  document.getElementById('dashYearName3').textContent=ys;\n\n  var ciro=0,tahsilat=0,alacak=0,tahsilatKDV=0,tahsilatKom=0;\n  var dd={};\n  var yearly={};\n  var yearlyDisc={};\n\n  var allActive=getActiveRecords();\n  var yearlyRecords=allActive.filter(function(r){return(r.siparisTarihi||'').substring(0,4)===ys;});\n\n  allActive.forEach(function(r){\n    var t=parseTRMoney(r.tutar);\n    var sm=(r.siparisTarihi||'').substring(0,7);\n    var sy=(r.siparisTarihi||'').substring(0,4);\n    var rep=r.satisTem||'Belirtilmemi\\u015f';\n    var cf=getRecordCashflow(r,ms);\n\n    /* Secili ayin cirosu: siparis tarihi o aya dusenler */\n    if(sm===ms){\n      ciro+=t;\n      var parts=(r.siparisTarihi||'').split('-');\n      if(parts.length>2){var day=parseInt(parts[2],10);dd[day]=(dd[day]||0)+t;}\n    }\n\n    /* Secili ayin kasasi */\n    if(cf.kasa>0){\n      tahsilat+=cf.kasa;\n      tahsilatKDV+=cf.kdv;\n      tahsilatKom+=cf.komisyon;\n    }\n\n    /* Bekleyen alacak: tam odenmemis siparislerin kalani */\n    var kalan=getRemaining(r);\n    if(t>0&&kalan>0.005)alacak+=kalan;\n\n    /* Yillik ozet: siparis sayisi siparis tarihine, indirim agirligi da ayni aya */\n    if(sy===ys){\n      var monthIdx=parseInt(sm.split('-')[1],10)-1;\n      if(!yearly[monthIdx])yearly[monthIdx]={count:0,kasa:0,kdv:0,kom:0,net:0};\n      yearly[monthIdx].count+=1;\n      var araToplamY=0;(r.products||[]).forEach(function(pp){araToplamY+=getProdLineTotal(pp);});\n      if(araToplamY>0){\n        var iYY=(t\u003caraToplamY)?((araToplamY-t)/araToplamY)*100:0;\n        if(!yearlyDisc[monthIdx])yearlyDisc[monthIdx]={weighted:0,weight:0};\n        yearlyDisc[monthIdx].weighted+=iYY*araToplamY;\n        yearlyDisc[monthIdx].weight+=araToplamY;\n      }\n    }\n\n    /* Yillik kasa/kdv/komisyon: her odeme kendi tarihinin ayina yazilir */\n    var nr=netRatioFor(r);\n    var primOranY=(rep==='Fahri Can')?0:4.5;\n    getPayments(r).forEach(function(pmt){\n      var amt=parseTRMoney(pmt.tutar),d=String(pmt.tarih||'');\n      if(amt\u003c=0||!d)return;\n      if(d.substring(0,4)!==ys)return;\n      var mIdx=parseInt(d.substring(5,7),10)-1;\n      if(isNaN(mIdx)||mIdx\u003c0||mIdx>11)return;\n      if(!yearly[mIdx])yearly[mIdx]={count:0,kasa:0,kdv:0,kom:0,net:0};\n      var kdvP=amt*(1-nr);\n      if(kdvP\u003c0)kdvP=0;\n      var komP=paymentCommission(pmt)+amt*(primOranY/100);\n      yearly[mIdx].kasa+=amt;\n      yearly[mIdx].kdv+=kdvP;\n      yearly[mIdx].kom+=komP;\n      yearly[mIdx].net+=(amt-kdvP-komP);\n    });\n  });\n\n  /* ─── Üst Stat Kartları ─── */\n  document.getElementById('dashCiro').textContent=formatMoney(ciro)+' ₺';\n  document.getElementById('dashTahsilat').textContent=formatMoney(tahsilat)+' ₺';\n  document.getElementById('dashAlacak').textContent=formatMoney(alacak)+' ₺';\n  document.getElementById('dashTahsilatKDV').textContent=formatMoneyNum(tahsilatKDV)+' ₺';\n  document.getElementById('dashTahsilatKom').textContent=formatMoneyNum(tahsilatKom)+' ₺';\n  document.getElementById('dashTahsilatNet').textContent=formatMoneyNum(tahsilat-tahsilatKDV-tahsilatKom)+' ₺';\n\n  /* ─── Personel Aylık ─── */\n  var rsM=aggregatePersonnel(allActive,ms);\n  document.getElementById('repTableContainer').innerHTML=buildPersonnelTable(rsM,'Bu ay henüz veri yok.');\n\n  /* ─── Kategori Aylık ─── */\n  var catM=aggregateCategory(allActive,ms);\n  document.getElementById('categoryTableContainer').innerHTML=buildCategoryTable(catM,'Bu ay henüz kategori bazlı satış yok.');\n\n  /* ─── Personel Yıllık ─── */\n  var rsY=aggregatePersonnel(yearlyRecords,null);\n  document.getElementById('repTableYearlyContainer').innerHTML=buildPersonnelTable(rsY,'Bu yıl henüz veri yok.');\n\n  /* ─── Kategori Yıllık ─── */\n  var catY=aggregateCategory(yearlyRecords,null);\n  document.getElementById('categoryTableYearlyContainer').innerHTML=buildCategoryTable(catY,'Bu yıl henüz kategori bazlı satış yok.');\n\n  /* ─── Yıllık Performans Özeti (12 ay) ─── */\n  var yBody='',yTotals={count:0,kasa:0,kdv:0,kom:0,net:0};\n  var yTotalsDisc={weighted:0,weight:0};\n  for(var mi=0;mi\u003c12;mi++){\n    var v=yearly[mi];\n    if(!v||(v.count===0&&v.kasa===0))continue;\n    yTotals.count+=v.count;yTotals.kasa+=v.kasa;yTotals.kdv+=v.kdv;yTotals.kom+=v.kom;yTotals.net+=v.net;\n    var d=yearlyDisc[mi];\n    if(d){yTotalsDisc.weighted+=d.weighted;yTotalsDisc.weight+=d.weight;}\n    var ynso=v.count>0?(v.net/v.count):0;\n    var iAvgM=(d&&d.weight>0)?(d.weighted/d.weight):null;\n    var iCellM=iAvgM===null?'\u003cspan style=\"color:var(--gray-400);\">—\u003c/span>':'%'+Math.round(iAvgM);\n    yBody+='\u003ctr>\u003ctd>\u003cdiv style=\"font-weight:600;font-size:13px;\">'+AYLAR[mi]+'\u003c/div>\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+v.count+'\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:600;\">'+formatMoneyNum(v.kasa)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(v.kdv)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+formatMoneyNum(v.kom)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--black);font-weight:700;\">'+formatMoneyNum(v.net)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:500;\">'+formatMoneyNum(ynso)+' ₺\u003c/td>'+\n      '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--gray-600);\">'+iCellM+'\u003c/td>\u003c/tr>';\n  }\n  if(!yBody)yBody='\u003ctr>\u003ctd colspan=\"8\" style=\"text-align:center;color:var(--gray-400);padding:30px 10px;\">Bu yıl henüz veri yok.\u003c/td>\u003c/tr>';\n  var yNetSepetOrt=yTotals.count>0?(yTotals.net/yTotals.count):0;\n  var yIAvg=yTotalsDisc.weight>0?(yTotalsDisc.weighted/yTotalsDisc.weight):null;\n  var yICell=yIAvg===null?'—':'%'+Math.round(yIAvg);\n  var yFoot='\u003ctr>\u003ctd style=\"font-weight:700;text-transform:uppercase;font-size:11px;color:var(--gray-600);\">Toplam ('+ys+')\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+yTotals.count+'\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);color:var(--green);font-weight:700;\">'+formatMoneyNum(yTotals.kasa)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(yTotals.kdv)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:600;\">'+formatMoneyNum(yTotals.kom)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(yTotals.net)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+formatMoneyNum(yNetSepetOrt)+' ₺\u003c/td>'+\n    '\u003ctd style=\"text-align:right;font-family:var(--mono);font-weight:700;\">'+yICell+'\u003c/td>\u003c/tr>';\n  document.getElementById('yearlyTableContainer').innerHTML=\n    '\u003ctable class=\"dash-table\">\u003cthead>\u003ctr>'+\n    '\u003cth style=\"text-align:left\">Ay\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Sipariş\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Kasa\u003c/th>'+\n    '\u003cth style=\"text-align:right\">KDV\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Komisyon\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net\u003c/th>'+\n    '\u003cth style=\"text-align:right\">Net Sepet Ort\u003c/th>'+\n    '\u003cth style=\"text-align:right\">İndirim\u003c/th>'+\n    '\u003c/tr>\u003c/thead>\u003ctbody>'+yBody+'\u003c/tbody>\u003ctfoot>'+yFoot+'\u003c/tfoot>\u003c/table>';\n\n  /* ─── Günlük Satış Trendi (line chart) ─── */\n  if(lineChartInst)lineChartInst.destroy();\n  if(typeof Chart==='undefined')return;\n  Chart.defaults.font.family=\"'DM Sans',sans-serif\";Chart.defaults.color='#999';\n  var days=[],dv=[];for(var i=1;i\u003c=31;i++){if(dd[i]){days.push(i);dv.push(dd[i]);}}\n  lineChartInst=new Chart(document.getElementById('lineChart'),{type:'line',data:{labels:days,datasets:[{label:'Günlük Ciro (₺)',data:dv,borderColor:'#F5C800',backgroundColor:'rgba(245,200,0,0.1)',borderWidth:3,fill:true,tension:0.4,pointBackgroundColor:'#111'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{borderDash:[4,4],color:'#f0f0f0'}},x:{grid:{display:false}}}}});\n}\n\n\nfunction updateCount(){document.querySelectorAll('.recordCountBadge').forEach(function(el){el.textContent=getActiveRecords().length;});}\n\n/* ═══ FORM YÖNETİMİ ═══ */\nfunction newForm(id){\n  id=(typeof id==='string'||typeof id==='number')?String(id):null;\n  editingId=id;productRowCount=0;formPayments=[];document.getElementById('productRows').innerHTML='';resetPayChips();\n  var today=getLocalTodayStr();\n  ['teslimTarihi','satisTem','adSoyad','telefon','eposta','tcVergi','tutar','kapora','bakiye'].forEach(function(f){var el=document.getElementById(f);if(el)el.value='';});\n  document.getElementById('siparisTarihi').value=today;\n  document.getElementById('tutar').dataset.manual='false';document.getElementById('lblAraToplam').textContent='0 \\u20ba';document.getElementById('lblIndirim').style.display='none';\n  RX_IDS.forEach(function(rxid){var el=document.getElementById(rxid);if(el)el.value='';});\n  if(id){var rec=records.find(function(r){return r.id===id;});if(rec)loadRecord(rec);}\n  else{var no=generateNo();document.getElementById('siparisNo').value=no;document.getElementById('orderNoLabel').textContent=no;addProductRow();addProductRow();addProductRow();}\n  renderPaymentList();\n  showForm();document.getElementById('formScroll').scrollTop=0;\n  formDirty=false;\n}\n\nfunction loadRecord(rec){\n  document.getElementById('siparisNo').value=rec.no;document.getElementById('orderNoLabel').textContent=rec.no;\n  ['siparisTarihi','teslimTarihi','satisTem','adSoyad','telefon','eposta','tcVergi'].forEach(function(f){var el=document.getElementById(f);if(el)el.value=rec[f]||'';});\n  var tel=document.getElementById('tutar');if(tel)tel.value=rec.tutar?formatMoneyAuto(rec.tutar):'';\n  if(rec.tutar)document.getElementById('tutar').dataset.manual='true';\n  var rx=rec.rx||{};Object.keys(rx).forEach(function(k){var el=document.getElementById(k);if(el)el.value=rx[k];});\n  (rec.products||[]).forEach(function(p){addProductRow(p.urun,p.adet,p.ekartman,p.kopru,p.kol,p.kategori,p.fiyat);});\n  if(productRowCount===0)addProductRow();calcSubtotal();\n  /* Odemeleri forma yukle */\n  formPayments=getPayments(rec).map(function(p){return{tutar:p.tutar,tarih:p.tarih,yontem:p.yontem,ccDetail:p.ccDetail};});\n  renderPaymentList();\n  if(rec.recNebim){payState.recNebim=true;var nb=document.getElementById('chip-nb');if(nb){nb.classList.add('sel-chk');var c2=nb.querySelector('input');if(c2)c2.checked=true;}}\n}\n\n/* Formdaki odeme listesini ciz + Tahsil Edilen / Kalan kutularini guncelle */\nfunction renderPaymentList(){\n  var list=document.getElementById('paymentList');\n  if(!list)return;\n  var html='';\n  formPayments.forEach(function(p,idx){\n    var icon=p.yontem==='kk'?'\\ud83d\\udcb3':'\\ud83d\\udcb5';\n    var meta=formatDate(p.tarih)+(p.yontem==='kk'&&p.ccDetail?(' \\u00b7 '+p.ccDetail):'');\n    html+='\u003cdiv class=\"pay-item\">\u003cspan class=\"pay-item-icon\">'+icon+'\u003c/span>'+\n      '\u003cspan class=\"pay-item-amt\">'+formatMoneyAuto(p.tutar)+' \\u20ba\u003c/span>'+\n      '\u003cspan class=\"pay-item-meta\">'+meta+'\u003c/span>'+\n      '\u003cbutton type=\"button\" class=\"pay-item-del\" onclick=\"removeFormPayment('+idx+')\">\\u2715\u003c/button>\u003c/div>';\n  });\n  list.innerHTML=html;\n  updatePaymentTotals();\n}\nfunction removeFormPayment(idx){\n  if(idx\u003c0||idx>=formPayments.length)return;\n  formPayments.splice(idx,1);\n  formDirty=true;\n  renderPaymentList();\n}\n/* Tahsil Edilen / Kalan kutulari + salt-goruntu chipler */\nfunction updatePaymentTotals(){\n  var toplam=0,hasNakit=false,hasKK=false,kkDetail='';\n  formPayments.forEach(function(p){\n    toplam+=parseTRMoney(p.tutar);\n    if(p.yontem==='kk'){hasKK=true;if(!kkDetail&&p.ccDetail)kkDetail=p.ccDetail;}\n    else hasNakit=true;\n  });\n  var tutar=parseTRMoney(document.getElementById('tutar').value);\n  var kalan=tutar-toplam;\n  var kEl=document.getElementById('kapora');if(kEl)kEl.value=toplam>0?formatMoneyAuto(toplam):'';\n  var bEl=document.getElementById('bakiye');if(bEl)bEl.value=(tutar||toplam)?formatMoneyAuto(kalan):'';\n  /* Salt-goruntu chipler: kullanilan yontemleri yansitir */\n  var cn=document.getElementById('chip-kn'),ck=document.getElementById('chip-kk');\n  if(cn)cn.className='pay-chip pay-chip-ro'+(hasNakit?' ro-on sel-nakit':'');\n  if(ck){\n    ck.className='pay-chip pay-chip-ro'+(hasKK?' ro-on sel-kk':'');\n    ck.textContent=hasKK&&kkDetail?('\\ud83d\\udcb3 '+kkDetail):'\\ud83d\\udcb3 K.Kart\\u0131';\n  }\n  /* Kalan rozeti */\n  var badge=document.getElementById('kalanBadge');\n  if(badge){\n    if(tutar\u003c=0&&toplam\u003c=0){badge.className='pay-status pay-status-wait';badge.textContent='\\u23f3 Tahsilat yok';}\n    else if(kalan>0.005){badge.className='pay-status pay-status-wait';badge.textContent='\\u23f3 Bekliyor';}\n    else if(kalan\u003c-0.005){badge.className='pay-status pay-status-over';badge.textContent='\\u26a0\\ufe0f Fazla tahsilat';}\n    else{badge.className='pay-status pay-status-done';badge.textContent='\\u2705 Tamamland\\u0131';}\n  }\n}\n\nfunction addProductRow(urun,adet,ekartman,kopru,kol,kategori,fiyat){\n  urun=urun||'';adet=adet||'1';ekartman=ekartman||'';kopru=kopru||'';kol=kol||'';kategori=kategori||'';\n  /* Mevcut kayıt yüklenirken kuruşlu fiyatı doğru göster (eski \"1.250\" → \"1.250\", yeni \"1.250,50\" → \"1.250,50\") */\n  fiyat=fiyat?formatMoneyAuto(fiyat):'';productRowCount++;\n  var id='pr_'+productRowCount,adetId='adet_'+productRowCount,ekaId='eka_'+productRowCount,kopId='kop_'+productRowCount,kolId='kol_'+productRowCount,catId='cat_'+productRowCount;\n  var div=document.createElement('div');div.className='product-row';div.id=id;\n  div.innerHTML='\u003cinput type=\"text\" placeholder=\"Ürün adı / model\" value=\"'+urun+'\" autocomplete=\"off\">'+\n    '\u003cinput class=\"product-row-input prod-adet select-mock\" id=\"'+adetId+'\" value=\"'+adet+'\" readonly onclick=\"openPicker(\\'Adet Seç\\',null,\\''+adetId+'\\',\\'adet\\')\" placeholder=\"1\">'+\n    '\u003cinput class=\"product-row-input prod-sel sele \nfunction openAddPaymentModal(){\n  payModalMode='form';quickPayRecordId=null;\n  var tutar=parseTRMoney(document.getElementById('tutar').value);\n  var paid=0;formPayments.forEach(function(p){paid+=parseTRMoney(p.tutar);});\n  var kalan=tutar-paid;\n  document.getElementById('qpTitle').textContent='Kapora / Tahsilat Ekle';\n  document.getElementById('qpBakiye').textContent=formatMoneyAuto(kalan>0?kalan:0)+' \\u20ba';\n  document.getElementById('qpTutar').value=(kalan>0.005)?formatMoneyAuto(kalan):'';\n  document.getElementById('qpTarih').value=getLocalTodayStr();\n  document.getElementById('quickPayOverlay').classList.add('open');\n}\n/* Kayitlar sayfasindan hizli tahsilat */\nfunction openQuickPay(id){\n  document.getElementById('detailOverlay').classList.remove('open');\n  payModalMode='record';quickPayRecordId=id;\n  var rec=records.find(function(r){return r.id===id;});\n  if(!rec)return;\n  var kalan=getRemaining(rec);\n  document.getElementById('qpTitle').textContent='H\\u0131zl\\u0131 Tahsilat';\n  document.getElementById('qpBakiye').textContent=formatMoneyAuto(kalan>0?kalan:0)+' \\u20ba';\n  document.getElementById('qpTutar').value=(kalan>0.005)?formatMoneyAuto(kalan):'';\n  document.getElementById('qpTarih').value=getLocalTodayStr();\n  document.getElementById('quickPayOverlay').classList.add('open');\n}\nfunction qpFillRemaining(){\n  var txt=(document.getElementById('qpBakiye').textContent||'').replace('\\u20ba','');\n  document.getElementById('qpTutar').value=formatMoneyAuto(parseTRMoney(txt));\n}\nfunction closeQuickPay(){document.getElementById('quickPayOverlay').classList.remove('open');quickPayMode=false;quickPayRecordId=null;}\nfunction closeQuickPayModal(e){if(!e||e.target===document.getElementById('quickPayOverlay'))closeQuickPay();}\n\n/* Modaldan gelen odeme: nakit ise direkt, kk ise banka/taksit modali */\nfunction processQuickPay(method){\n  var amt=parseTRMoney(document.getElementById('qpTutar').value);\n  var tarih=document.getElementById('qpTarih').value||getLocalTodayStr();\n  if(amt\u003c=0){toast('\\u26a0\\ufe0f Tahsilat tutar\\u0131 girin',false);return;}\n  if(method==='nakit'){\n    commitPayment({tutar:formatMoneyAuto(amt),tarih:tarih,yontem:'nakit',ccDetail:''});\n  }else{\n    quickPayMode=true;activeCCKey='payment';\n    document.getElementById('quickPayOverlay').classList.remove('open');\n    resetCCModal();document.getElementById('ccOverlay').classList.add('open');\n  }\n}\n/* Odemeyi hedefe (form veya kayit) ekle */\nfunction commitPayment(pay){\n  if(payModalMode==='form'){\n    formPayments.push(pay);\n    formPayments.sort(function(a,b){return String(a.tarih||'').localeCompare(String(b.tarih||''));});\n    formDirty=true;\n    renderPaymentList();\n    closeQuickPay();\n    toast('\\u2705 Tahsilat eklendi',true);\n    return;\n  }\n  var rec=records.find(function(r){return r.id===quickPayRecordId;});\n  if(!rec){closeQuickPay();return;}\n  var arr=getPayments(rec);\n  arr.push(pay);\n  setPayments(rec,arr);\n  /* Tam odendiyse teslim tarihi odeme gunune cekilir */\n  if(isFullyPaid(rec))rec.teslimTarihi=pay.tarih;\n  executeQuickPaySave(rec);\n}\nfunction executeQuickPaySave(rec){\n  toast('Tahsilat i\\u015fleniyor...',true);\n  saveRecordToServer(rec,function(){\n    saveLocal();updateAllViews();toast('\\u2705 Tahsilat kaydedildi!',true);closeDetailModal();closeQuickPay();\n  });\n}\nfunction deleteRecord(id){\n  if(!confirm('Bu sipariş çöp kutusuna taşınsın mı?'))return;\n  var rec=records.find(function(r){return r.id===id;});if(!rec)return;\n  rec.deleted=true;rec.deletedAt=new Date().toISOString();toast('Çöp kutusuna taşınıyor...',true);\n  saveRecordToServer(rec,function(){saveLocal();updateAllViews();closeDetailModal();toast('Çöp kutusuna taşındı',true);});\n}\n\n/* ═══ EXPORT ═══ */\nfunction openExportModal(){document.getElementById('exportCount').textContent=getActiveRecords().length+' sipariş dışa aktarılacak';selectExport('csv');document.getElementById('exportOverlay').classList.add('open');}\nfunction closeExportModal(e){if(!e||e.target===document.getElementById('exportOverlay'))document.getElementById('exportOverlay').classList.remove('open');}\nfunction selectExport(fmt){exportFormat=fmt;document.getElementById('opt-csv').classList.toggle('selected',fmt==='csv');document.getElementById('opt-xlsx').classList.toggle('selected',fmt==='xlsx');}\nfunction doExport(){if(!getActiveRecords().length){toast('Dışa aktarılacak kayıt yok');return;}closeExportModal();exportFormat==='xlsx'?exportExcel():exportCSV();}\n\nvar HEADER=['No','Ad Soyad','Telefon','E-Posta','Sipariş Tarihi','Teslim Tarihi','Satış Temsilcisi','Uzak R Sph','Uzak R Cyl','Uzak R Ax','Uzak R Pdm','Uzak R Yük','Uzak R Not','Uzak L Sph','Uzak L Cyl','Uzak L Ax','Uzak L Pdm','Uzak L Yük','Uzak L Not','Yakın R Sph','Yakın R Cyl','Yakın R Ax','Yakın R Pdm','Yakın R Yük','Yakın R Not','Yakın L Sph','Yakın L Cyl','Yakın L Ax','Yakın L Pdm','Yakın L Yük','Yakın L Not','Tutar','Kapora','Bakiye','Tahsilat Tarihi','Üretim Durumu','Ürünler','TC/Vergi No','Pipedrive','Nebim'];\nfunction buildRow(r){var rxV=RX_IDS.map(function(f){return(r.rx&&r.rx[f])?r.rx[f]:'';});var uL=(r.products||[]).map(function(p){var ad=getProdAdet(p);return(ad>1?ad+'× ':'')+p.urun+(p.ekartman?' ['+p.ekartman+'-'+(p.kopru||'')+'-'+(p.kol||'')+']':'')+(p.kategori?' · '+p.kategori:'')+(p.fiyat?' - '+p.fiyat+' ₺':'');}).join(' | ');return[r.no,r.adSoyad,r.telefon,r.eposta,r.siparisTarihi,r.teslimTarihi,r.satisTem].concat(rxV).concat([r.tutar,r.kapora,r.bakiye,r.bakiyeTarih||'',r.siparisDurumu||'Satış Yapıldı',uL,r.tcVergi,r.recPipedrive?'Evet':'Hayır',r.recNebim?'Evet':'Hayır']);}\nfunction exportCSV(){var rows=getActiveRecords().map(function(r){return buildRow(r).map(function(v){return'\"'+(v||'').replace(/\"/g,'\"\"')+'\"';});});var csv=[HEADER].concat(rows).map(function(r){return r.join(',');}).join('\\n');dl('\\ufeff'+csv,'text/csv;charset=utf-8','damlakuz_'+getLocalTodayStr()+'.csv');toast('📄 CSV indirildi');}\nfunction exportExcel(){if(typeof XLSX==='undefined'){toast('⏳ SheetJS yükleniyor, lütfen tekrar dene',false);return;}var data=[HEADER].concat(getActiveRecords().map(buildRow));var ws=XLSX.utils.aoa_to_sheet(data);ws['!cols']=HEADER.map(function(_,i){return{wch:Math.max(12,...data.map(function(row){return(row[i]||'').toString().length;}))};});var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siparişler');XLSX.writeFile(wb,'damlakuz_'+getLocalTodayStr()+'.xlsx');toast('📊 Excel indirildi');}\n\nfunction generateNo(){var d=new Date(),y=d.getFullYear().toString().slice(-2),m=String(d.getMonth()+1).padStart(2,'0'),px='DK-'+m+'-'+y+'-',mx=0;records.forEach(function(r){if(r.no&&r.no.startsWith(px)){var ps=r.no.split('-'),nm=parseInt(ps[ps.length-1],10);if(!isNaN(nm)&&nm>mx)mx=nm;}});return px+String(mx+1).padStart(4,'0');}\nfunction formatDate(d){if(!d)return'';var p=String(d).split('-');if(p.length===3)return p[2]+'.'+p[1]+'.'+p[0];return d;}\nfunction dl(content,mime,name){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();}\n/* Form girişinde kuruş desteği:\n   - Rakam, nokta ve virgül kabul edilir\n   - Bir tane virgül: ondalık ayraç. Virgülden sonra max 2 basamak.\n   - Tam sayı kısmında binlik nokta otomatik eklenir. */\nfunction formatCurrency(el){\n  if(!el.value){calcBalance();return;}\n  var raw=String(el.value).replace(/[^0-9.,]/g,'');\n  var commaIdx=raw.indexOf(',');\n  if(commaIdx>-1){\n    var intPart=raw.substring(0,commaIdx).replace(/\\./g,'');\n    var decPart=raw.substring(commaIdx+1).replace(/[.,]/g,'').substring(0,2);\n    if(intPart==='')intPart='0';\n    var intNum=parseInt(intPart,10);\n    if(isNaN(intNum))intNum=0;\n    el.value=intNum.toLocaleString('tr-TR')+','+decPart;\n  }else{\n    var digits=raw.replace(/\\./g,'');\n    if(digits===''){el.value='';}else{\n      var n=parseInt(digits,10);\n      if(isNaN(n))n=0;\n      el.value=n.toLocaleString('tr-TR');\n    }\n  }\n  calcBalance();\n}\nfunction calcBalance(){updatePaymentTotals();}\n\n/* ═══ SENKRON KUYRUGU ═══\n   Sunucuya gidemeyen kayitlar localStorage'da bekler, tekrar denenir. */\nfunction getSyncQueue(){try{return JSON.parse(localStorage.getItem('dk_sync_queue')||'[]');}catch(e){return[];}}\nfunction setSyncQueue(q){try{localStorage.setItem('dk_sync_queue',JSON.stringify(q));}catch(e){}updateSyncBanner();}\nfunction queueRecord(rec){\n  var q=getSyncQueue();\n  q=q.filter(function(r){return r.id!==rec.id;});\n  q.push(rec);\n  setSyncQueue(q);\n}\nfunction unqueueRecord(id){setSyncQueue(getSyncQueue().filter(function(r){return r.id!==id;}));}\nfunction updateSyncBanner(){\n  var b=document.getElementById('syncBanner');if(!b)return;\n  var n=getSyncQueue().length;\n  var c=document.getElementById('syncCount');if(c)c.textContent=n;\n  if(n>0)b.classList.add('show');else b.classList.remove('show');\n}\n/* Tum kayit yazma islemleri buradan gecer: hata olursa kuyruga alinir */\nfunction saveRecordToServer(rec,onOk){\n  if(typeof google!=='undefined'&&google.script){\n    google.script.run\n      .withSuccessHandler(function(){unqueueRecord(rec.id);if(onOk)onOk();})\n      .withFailureHandler(function(err){\n        console.error(err);\n        queueRecord(rec);\n        toast('\\u26a0\\ufe0f Sunucuya kaydedilemedi, kuyruga alindi',false);\n        if(onOk)onOk();\n      })\n      .saveOrderData(rec);\n  }else{if(onOk)onOk();}\n}\nfunction retrySyncQueue(){\n  var q=getSyncQueue();\n  if(!q.length){toast('Bekleyen kay\\u0131t yok',true);return;}\n  if(typeof google==='undefined'||!google.script){toast('Sunucu ba\\u011flant\\u0131s\\u0131 yok',false);return;}\n  toast('Kuyruk g\\u00f6nderiliyor...',true);\n  var remaining=q.length,failed=0;\n  q.forEach(function(rec){\n    google.script.run\n      .withSuccessHandler(function(){\n        unqueueRecord(rec.id);remaining--;\n        if(remaining===0)toast(failed?('\\u26a0\\ufe0f '+failed+' kay\\u0131t hala g\\u00f6nderilemedi'):'\\u2705 Kuyruk temizlendi',!failed);\n      })\n      .withFailureHandler(function(){\n        failed++;remaining--;\n        if(remaining===0)toast('\\u26a0\\ufe0f '+failed+' kay\\u0131t hala g\\u00f6nderilemedi',false);\n      })\n      .saveOrderData(rec);\n  });\n}\n\n/* ═══ PICKER — kategori ve adet desteği eklendi ═══ */\nfunction openPicker(title,options,targetId,type){\n  document.getElementById('pickerTitle').textContent=title;\n  activePickerTarget=targetId;\n  activePickerType=type||'generic';\n  var grid=document.getElementById('pickerGrid');\n  var cv=document.getElementById(targetId).value;\n\n  if(activePickerType==='category'){\n    grid.className='picker-grid cat-grid';\n    grid.innerHTML=CATEGORIES.map(function(c){\n      var iconHtml=c.iconType==='svg'?('\u003cspan class=\"cat-icon-svg\">'+c.icon+'\u003c/span>'):('\u003cspan class=\"cat-icon\">'+c.icon+'\u003c/span>');\n      var safeName=c.name.replace(/'/g,\"\\\\'\");\n      return '\u003cdiv class=\"picker-opt'+(c.name===cv?' active':'')+'\" onclick=\"selPickerVal(\\''+safeName+'\\')\">'+iconHtml+'\u003cspan class=\"cat-name\">'+c.name+'\u003c/span>\u003cspan class=\"cat-vat\">%'+c.vat+' KDV\u003c/span>\u003c/div>';\n    }).join('');\n  }else if(activePickerType==='adet'){\n    grid.className='picker-grid adet-grid';\n    /* Mevcut değer 11+ ise \"10+\" butonu aktif gözüksün */\n    var currentN=parseInt((cv||'').replace(/[^0-9]/g,''),10);\n    var isCustom=!isNaN(currentN)&&currentN>10;\n    grid.innerHTML=ADET_OPTIONS.map(function(opt){\n      var isActive=(opt==='10+')?isCustom:(opt===cv);\n      var label=opt;\n      if(opt==='10+'&&isCustom)label=String(currentN);\n      return '\u003cdiv class=\"picker-opt'+(isActive?' active':'')+'\" onclick=\"selAdetVal(\\''+opt+'\\')\">'+label+'\u003c/div>';\n    }).join('');\n  }else{\n    grid.className=title.toUpperCase().includes('AX')?'picker-grid ax-grid':'picker-grid';\n    grid.innerHTML=options.map(function(opt){return'\u003cdiv class=\"picker-opt'+(opt===cv?' active':'')+'\" onclick=\"selPickerVal(\\''+opt+'\\')\">'+opt+'\u003c/div>';}).join('');\n  }\n  document.getElementById('pickerOverlay').classList.add('open');\n}\nfunction selAdetVal(val){\n  if(val==='10+'){\n    var input=prompt('Adet kaç olacak? (11 veya üstü)','11');\n    if(input===null){closePickerModal();return;}\n    var n=parseInt(input.replace(/[^0-9]/g,''),10);\n    if(isNaN(n)||n\u003c1)n=1;\n    if(activePickerTarget)document.getElementById(activePickerTarget).value=String(n);\n  }else{\n    if(activePickerTarget)document.getElementById(activePickerTarget).value=val;\n  }\n  closePickerModal();\n  calcSubtotal();\n}\nfunction selPickerVal(val){if(activePickerTarget)document.getElementById(activePickerTarget).value=val;closePickerModal();}\nfunction clearPicker(){\n  if(activePickerTarget){\n    /* Adet için varsayılan 1, diğerleri için boş */\n    if(activePickerType==='adet')document.getElementById(activePickerTarget).value='1';\n    else document.getElementById(activePickerTarget).value='';\n  }\n  closePickerModal();\n  if(activePickerType==='adet')calcSubtotal();\n}\nfunction closePickerModal(e){if(!e||e.target.id==='pickerOverlay'||!e.target){document.getElementById('pickerOverlay').classList.remove('open');activePickerTarget=null;activePickerType='generic';}}\n\nfunction selBank(el,val){document.querySelectorAll('#bankGrid .cc-opt').forEach(function(n){n.classList.remove('active');});el.classList.add('active');document.getElementById('ccBank').value=val;}\nfunction selTaksit(el,val){document.querySelectorAll('#taksitGrid .cc-opt').forEach(function(n){n.classList.remove('active');});el.classList.add('active');document.getElementById('ccTaksit').value=val;}\nfunction resetCCModal(){document.querySelectorAll('.modal .cc-opt').forEach(function(n){n.classList.remove('active');});document.getElementById('ccBank').value='';document.getElementById('ccTaksit').value='';}\n/* Chipler artik salt-goruntu; odeme yontemi sadece tahsilat modalindan girilir. */\nfunction toggleRec(key,chipId,cb){payState[key]=cb.checked;var el=document.getElementById(chipId);el.className='rec-chip'+(cb.checked?' sel-chk':'');}\nfunction saveCCModal(){\n  var bank=document.getElementById('ccBank').value,taksit=document.getElementById('ccTaksit').value;\n  if(!bank||!taksit){toast('L\\u00fctfen banka ve taksit se\\u00e7in',false);return;}\n  var text=bank+' '+taksit;\n  document.getElementById('ccOverlay').classList.remove('open');\n  if(quickPayMode){\n    var amt=parseTRMoney(document.getElementById('qpTutar').value);\n    var tarih=document.getElementById('qpTarih').value||getLocalTodayStr();\n    quickPayMode=false;\n    commitPayment({tutar:formatMoneyAuto(amt),tarih:tarih,yontem:'kk',ccDetail:text});\n    return;\n  }\n}\nfunction cancelCCModal(){document.getElementById('ccOverlay').classList.remove('open');quickPayMode=false;}\nfunction closeCCModal(e){if(!e||e.target===document.getElementById('ccOverlay'))cancelCCModal();}\nfunction resetPayChips(){\n  Object.keys(payState).forEach(function(k){payState[k]=false;});\n  ccDetails.kaporaKK='';ccDetails.bakiyeKK='';\n  var cn=document.getElementById('chip-kn');if(cn)cn.className='pay-chip pay-chip-ro';\n  var ck=document.getElementById('chip-kk');if(ck){ck.className='pay-chip pay-chip-ro';ck.textContent='\\ud83d\\udcb3 K.Kart\\u0131';}\n  var nb=document.getElementById('chip-nb');if(nb){nb.className='rec-chip';var c2=nb.querySelector('input');if(c2)c2.checked=false;}\n  var pl=document.getElementById('paymentList');if(pl)pl.innerHTML='';\n}\nfunction confirmClear(){if(confirm('Form temizlensin mi?'))newForm();}\nfunction toast(msg,ok){ok=ok!==false;var t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(ok?' ok':'');setTimeout(function(){t.className='toast';},2400);}\n\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/xl // Kuzmos önizleme arayüzü. Bu dosya build sırasında F (finans motoru), I/V/X (envanter), H (yardımcılar),
// ORIGINAL_FORM (korunan personel sipariş föyü) ve TEMPLATE_B64 (Excel şablonu) ile birlikte paketlenir.
(function () {
  'use strict';
  const { tl, esc, dateTR, monthTR, parseTL, formatInput } = H;
  const root = document.getElementById('kuzmos-app');
  const main = root.querySelector('#kz-main');
  let uidN = 0;
  const uid = () => Date.now().toString(36) + '-' + ++uidN;

  // ───────────────────────── durum ─────────────────────────
  const S = {
    books: F.demoBooks(),
    stock: I.inventorySeed(),
    role: 'admin',
    panel: 'finance',
    fin: 'overview',
    flash: null,
    doc: null,
    pay: null,
    plan: null,
    payFilter: 'open',
    payKind: 'all',
    paySearch: '',
    cal: { month: '2026-11', day: '' },
    partyId: '',
    accountId: 'bank-garanti',
    accRange: { from: '2026-11-01', to: '' },
    accAction: '',
    report: { tab: 'compare', from: '2026-11-01', to: '2026-11-30' },
    defs: 'parties',
    editDef: '',
    reviewId: '',
    inv: { view: 'eyewear', importPlan: null, manualKind: 'Gozluk' },
    staff: { barcode: '8680000001041', product: null, frame: null, ready: false, pending: null, nonce: '' },
    users: [],
    quickParty: false,
  };
  const today = () => S.books.today;
  S.accRange.to = today();

  // ───────────────────────── küçük bileşenler ─────────────────────────
  const tag = (t, tone = '') => '<span class="tag ' + tone + '">' + esc(t) + '</span>';
  const statusTone = (s) => ({ Gecikmiş: 'bad', 'Kısmi · gecikmiş': 'bad', Bugün: 'warn', 'Bu hafta': 'warn', 'Kısmi ödendi': 'info', Ödendi: 'ok', İptal: '' })[s] || '';
  function head(title, sub, actions = '') {
    return '<div class="head"><div><h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div class="row">' + actions + '</div></div>';
  }
  function kpi(label, value, sub = '', cls = '') {
    return '<article class="kpi ' + cls + '"><small>' + label + '</small><strong>' + value + '</strong><em>' + sub + '</em></article>';
  }
  function card(title, body, { sub = '', actions = '', id = '' } = {}) {
    return '<section class="card"' + (id ? ' id="' + id + '"' : '') + '><header><div><h3>' + title + '</h3>' + (sub ? '<p>' + sub + '</p>' : '') + '</div><div class="row">' + actions + '</div></header>' + body + '</section>';
  }
  function table(headers, rows, { empty = 'Kayıt yok.', foot = '' } = {}) {
    if (!rows.length) return '<div class="empty">' + empty + '</div>';
    return '<div class="tbl"><table><thead><tr>' + headers.map((h) => (h.startsWith('#') ? '<th class="num">' + h.slice(1) + '</th>' : '<th>' + h + '</th>')).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody>' + (foot ? '<tfoot>' + foot + '</tfoot>' : '') + '</table></div>';
  }
  const td = (v, sub = '') => '<td>' + v + (sub ? '<small>' + sub + '</small>' : '') + '</td>';
  const tdn = (v, cls = '') => '<td class="num ' + cls + '">' + v + '</td>';
  function field(label, control, { hint = '', wide = false } = {}) {
    return '<label class="f' + (wide ? ' wide' : '') + '">' + label + control + (hint ? '<span class="hint">' + hint + '</span>' : '') + '</label>';
  }
  function input(name, value = '', attrs = '') {
    return '<input name="' + name + '" value="' + esc(value) + '" ' + attrs + '>';
  }
  const money = (name, value, attrs = '') => input(name, value, 'inputmode="decimal" autocomplete="off" placeholder="0,00" ' + attrs);
  function select(name, options, value, attrs = '') {
    return '<select name="' + name + '" ' + attrs + '>' + options.map((o) => {
      const [v, t, dis] = Array.isArray(o) ? o : [o, o];
      return '<option value="' + esc(v) + '"' + (String(v) === String(value) ? ' selected' : '') + (dis ? ' disabled' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select>';
  }
  const btn = (act, text, { cls = '', data = {}, pressed, disabled } = {}) =>
    '<button type="button" class="' + cls + '" data-act="' + act + '"' + Object.entries(data).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join('') + (pressed !== undefined ? ' aria-pressed="' + pressed + '"' : '') + (disabled ? ' disabled' : '') + '>' + text + '</button>';
  const chips = (act, items, current) => '<div class="chips">' + items.map(([v, t]) => btn(act, t, { data: { v }, pressed: v === current })).join('') + '</div>';

  const partyLabel = (id) => S.books.parties.find((p) => p.id === id)?.label || '—';
  const accLabel = (id) => F.accountInfo(S.books, id)?.label || id || '—';
  const catLabel = (id) => S.books.categories.find((c) => c.id === id)?.label || '—';
  const activeAccounts = (kinds) => S.books.accounts.filter((a) => a.active && (!kinds || kinds.includes(a.kind)));
  const partiesOf = (types) => S.books.parties.filter((p) => p.active && (!types || types.includes(p.type)));
  const method = (m) => F.METHODS[m] || m;
  const kindLabel = (k) => ({ party: 'Firma borcu', staff: 'Maaş', tax: 'Vergi / SGK', loan: 'Kredi', 'card-statement': 'Kart ekstresi', instrument: 'Çek / senet', expected: 'Belge bekleniyor' })[k] || k;

  // ───────────────────────── işlem çalıştırma ─────────────────────────
  function flash(text, kind = 'ok') {
    S.flash = { text, kind };
  }
  /** Defterin kopyası üzerinde çalışır; hata olursa hiçbir şey değişmez (ya hepsi ya hiçbiri). */
  function mutate(fn, okText, errTarget) {
    const next = structuredClone(S.books);
    try {
      const r = fn(next);
      S.books = next;
      if (okText) flash(typeof okText === 'function' ? okText(r) : okText);
      render();
      return true;
    } catch (e) {
      showError(e, errTarget);
      return false;
    }
  }
  function showError(e, target) {
    const msg = friendly(e.message);
    const el = target && main.querySelector(target);
    if (el) {
      el.textContent = msg;
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } else {
      flash(msg, 'err');
      render();
    }
  }
  function friendly(m) {
    return ({ IDEMPOTENCY_CONFLICT: 'Bu işlem farklı bilgilerle daha önce kaydedilmiş.', UNBALANCED_ENTRY: 'Fiş dengesiz; tutarları kontrol edin.', INVALID_LINE: 'Tutarlardan biri geçersiz.' })[m] || m;
  }
  function go(panel, fin) {
    S.panel = panel;
    if (fin) S.fin = fin;
    S.flash = null;
    render();
    root.scrollIntoView({ block: 'start' });
  }

  // ───────────────────────── kabuk ─────────────────────────
  const PANELS = [
    ['manager', 'Yönetici'],
    ['finance', 'Finans · Gider'],
    ['staff', 'Personel · Sipariş'],
    ['inventory', 'Envanter · Barkod'],
  ];
  function render() {
    if (!H.canPanel(S.role, S.panel) && !(S.panel === 'users' && S.role === 'admin')) S.panel = H.ROLE_PANELS[S.role][0];
    root.querySelector('#kz-today').textContent = 'Çalışma günü: ' + dateTR(today(), { year: true, weekday: true });
    const roleSel = root.querySelector('#kz-role');
    roleSel.innerHTML = Object.entries(H.ROLE_LABELS).map(([v, t]) => '<option value="' + v + '"' + (v === S.role ? ' selected' : '') + '>' + t + '</option>').join('');
    root.querySelector('#kz-tabs').innerHTML = PANELS.filter(([p]) => H.canPanel(S.role, p)).map(([p, t]) => btn('panel', t, { data: { v: p }, pressed: p === S.panel || (p === 'manager' && S.panel === 'users') })).join('');
    S.staff.frame = null;
    S.staff.ready = false;
    const fl = S.flash ? '<div class="flash ' + (S.flash.kind === 'err' ? 'err' : '') + '" role="status"><span>' + esc(S.flash.text) + '</span>' + btn('dismiss', '✕', { cls: 'ghost' }) + '</div>' : '';
    if (S.panel === 'finance') main.innerHTML = '<div class="layout">' + financeNav() + '<div class="content">' + fl + financeScreen() + '</div></div>';
    else main.innerHTML = '<div class="layout single"><div class="content">' + fl + ({ manager: managerScreen, staff: staffScreen, inventory: inventoryScreen, users: usersScreen }[S.panel] || managerScreen)() + '</div></div>';
    if (S.panel === 'staff') mountStaffFrame();
    if (S.panel === 'finance' && S.fin === 'new') refreshDocPreview();
    if (S.panel === 'finance' && S.pay) refreshPayPreview();
  }

  // ───────────────────────── finans menüsü ─────────────────────────
  function financeNav() {
    const b = S.books;
    const overdue = F.openItems(b).filter((o) => o.due < today()).length;
    const reviews = F.reviewItems(b).filter((r) => r.remaining > 0).length;
    const ins = b.instruments.filter((x) => x.status === 'issued').length;
    const items = [
      ['Günlük', [['overview', 'Özet'], ['new', '＋ Yeni kayıt'], ['payables', 'Ödemeler', overdue], ['calendar', 'Takvim']]],
      ['Kayıtlar', [['parties', 'Cariler'], ['accounts', 'Banka · kasa · kart'], ['instruments', 'Çek / senet', ins, 'soft'], ['collections', 'Tahsilatlar']]],
      ['Kontrol', [['review', 'İnceleme', reviews], ['reports', 'Raporlar'], ['closing', 'Kapanış'], ['defs', 'Tanımlar']]],
    ];
    return '<nav class="side" aria-label="Finans menüsü">' + items.map(([g, xs]) => '<div class="grp">' + g + '</div>' + xs.map(([v, t, n, cls]) => btn('fin', '<span>' + t + '</span>' + (n ? '<span class="badge ' + (cls || '') + '">' + n + '</span>' : ''), { data: { v }, pressed: S.fin === v || (v === 'parties' && S.fin === 'party') })).join('')).join('') + '</nav>';
  }
  function financeScreen() {
    return ({ overview, new: newRecord, payables, calendar, parties, party: partyDetail, accounts, instruments, collections, review, reports, closing, defs }[S.fin] || overview)();
  }

  // ───────────────────────── Özet ─────────────────────────
  function overview() {
    const b = S.books;
    const bal = F.moneyBalances(b);
    const cash = bal.filter((a) => ['bank', 'cash'].includes(a.kind));
    const cards = bal.filter((a) => a.kind === 'card');
    const open = F.openItems(b);
    const overdue = open.filter((o) => o.due < today());
    const week = open.filter((o) => (o.plan?.date || o.due) <= F.addDays(today(), 7));
    const rv = F.reviewItems(b).filter((r) => r.remaining > 0);
    const pj = F.projection(b, 30);
    const month = today().slice(0, 7);
    const range = { from: month + '-01', to: today() };
    const br = F.reportBridge(b, range);
    const alerts = [];
    if (overdue.length) alerts.push(['bad', overdue.length + ' ödeme vadesini geçti: ' + overdue.map((o) => esc(o.partyLabel)).join(', '), 'payables']);
    if (rv.length) alerts.push(['warn', 'İncelemede ' + tl(rv.reduce((s, r) => s + r.remaining, 0)) + ' açıklanmamış fark var (' + esc(rv[0].source) + '). Otomatik gider yazılmadı.', 'review']);
    for (const ins of b.instruments.filter((x) => x.status === 'issued')) {
      const days = H.daysBetween(today(), ins.maturity);
      const accBal = ins.accountId ? F.balance(b, ins.accountId, { asOf: today() }) : null;
      if (days <= 10) alerts.push([accBal !== null && accBal < ins.amount ? 'bad' : 'warn', method(ins.type) + ' ' + esc(ins.no) + ' · ' + tl(ins.amount) + ' · ' + (days >= 0 ? days + ' gün sonra' : 'vadesi geçti') + (accBal !== null ? ' · ' + esc(accLabel(ins.accountId)) + ' bakiyesi ' + tl(accBal) + (accBal < ins.amount ? ' (yetersiz, virman gerekli)' : '') : ''), 'instruments']);
    }
    if (pj.min.balance < 0) alerts.push(['bad', 'Nakit projeksiyonu ' + dateTR(pj.min.date) + ' tarihinde ' + tl(pj.min.balance) + ' gösteriyor.', 'calendar']);
    const exp = b.expected.filter((x) => x.status === 'expected');
    return (
      head('Finans özeti', 'Belge → borç → ödeme → nakit. Bütün rakamlar aynı dengeli fişlerden üretilir.', btn('fin', '＋ Yeni kayıt', { cls: 'primary', data: { v: 'new' } })) +
      '<div class="kpis">' +
      kpi('Kasa + banka (bugün)', tl(cash.reduce((s, a) => s + a.balance, 0)), cash.map((a) => esc(a.label.split(' · ')[0]) + ' ' + tl(a.balance)).join(' · '), 'hl') +
      kpi('Şirket kartı borcu', tl(cards.reduce((s, a) => s + a.balance, 0)), 'Ekstre ödenince bankadan çıkar') +
      kpi('Açık borçlar', tl(open.reduce((s, o) => s + o.remaining, 0)), overdue.length ? '<span class="neg">' + tl(overdue.reduce((s, o) => s + o.remaining, 0)) + ' gecikmiş</span>' : 'Gecikmiş yok', overdue.length ? 'bad' : '') +
      kpi('30 gün sonra tahmini nakit', tl(pj.end), 'En düşük ' + tl(pj.min.balance) + ' · ' + dateTR(pj.min.date), pj.min.balance < 0 ? 'bad' : '') +
      '</div>' +
      (alerts.length ? '<div class="card"><header><h3>Dikkat edilmesi gerekenler</h3></header><div class="list">' + alerts.map(([t, x, l]) => '<div><span>' + tag(t === 'bad' ? 'Acil' : 'Uyarı', t) + ' ' + x + '</span>' + btn('fin', 'Aç →', { cls: 'ghost', data: { v: l } }) + '</div>').join('') + '</div></div>' : '') +
      '<div class="grid2">' +
      card('Nakit projeksiyonu · 30 gün', projectionChart(pj) + '<div class="legend"><span><i style="background:#1d1d1f"></i>Tahmini kasa + banka</span><span><i style="background:#f5c800"></i>Planlanan çıkış</span><span><i style="background:#c7c7cc"></i>Belgesi beklenen</span></div>', { sub: 'Bugünkü kasa+banka − plan tarihindeki ödemeler. Kartla planlananlar ekstre gününe kadar nakit çıkarmaz. POS’ta bekleyen ' + tl(pj.posPending) + ' dahil değildir.' }) +
      card('Önümüzdeki 7 gün', week.length ? '<div class="list">' + week.map((o) => '<div><span><b>' + esc(o.partyLabel) + '</b><small>' + dateTR(o.plan?.date || o.due) + ' · ' + esc(kindLabel(o.kind)) + ' · ' + esc(method(o.plan?.method)) + '</small></span><span class="row"><b class="num">' + tl(o.remaining) + '</b>' + tag(o.status, statusTone(o.status)) + btn('open-pay', 'Öde', { cls: 'small', data: { id: o.id } }) + '</span></div>').join('') + '</div>' : '<div class="empty">Bu hafta ödeme yok.</div>', { actions: btn('fin', 'Tümü →', { cls: 'ghost', data: { v: 'payables' } }) }) +
      '</div>' +
      card(monthTR(month) + ': üç soru, üç ayrı cevap', threeAnswers(br) + bridgeView(br), { sub: 'Firmalara ödenen, kasadan çıkan ve gider (kâr/zarar) aynı rakam değildir; birbirine eklenmez.', actions: btn('fin', 'Raporlar →', { cls: 'ghost', data: { v: 'reports' } }) }) +
      (exp.length ? card('Belgesi beklenen planlar', table(['Vade', 'Firma', 'Açıklama', '#Tahmini', ''], exp.map((x) => '<tr>' + td(dateTR(x.due)) + td(esc(partyLabel(x.partyId))) + td(esc(x.label), 'Muhasebe kaydı yok · fatura gelince kaydedilir') + tdn(tl(x.amount)) + '<td class="num">' + btn('expected-to-doc', 'Faturayı gir', { cls: 'small', data: { id: x.id } }) + '</td></tr>')), { sub: 'Tekrarlayan ödemelerden üretildi. Nakit projeksiyonuna girer, gider ve borç yaratmaz.' }) : '')
    );
  }
  function threeAnswers(br) {
    return '<div class="three" style="padding:14px 16px 0;margin:0">' +
      '<div><small>1 · Kime ne ödendi?</small><strong>' + tl(br.payments) + '</strong><p>Firmalara, personele, vergi dairesine ve bankaya kapatılan borçlar (kart, çek, senet dahil).</p></div>' +
      '<div><small>2 · Kasadan / bankadan çıkan</small><strong>' + tl(br.cashOut) + '</strong><p>Gerçek para çıkışı. Hesaplar arası virman hariç.</p></div>' +
      '<div><small>3 · Gider (kâr/zarar etkisi)</small><strong>' + tl(br.expenses) + '</strong><p>Belgeye göre, ödemeden bağımsız. Stok alımı ve vergi ödemesi gider değildir.</p></div></div>';
  }
  function bridgeView(br) {
    const row = (sign, label, v) => '<div><i>' + sign + '</i><span>' + label + '</span><b class="num">' + tl(v) + '</b></div>';

  function projectionChart(pj) {
    const W = 640, Hh = 190, P = { l: 8, r: 8, t: 14, b: 22 };
    const vals = pj.series.map((s) => s.balance).concat([pj.start, 0]);
    const max = Math.max(...vals), min = Math.min(...vals);
    const span = max - min || 1;
    const n = pj.series.length;
    const x = (i) => P.l + (i * (W - P.l - P.r)) / Math.max(1, n - 1);
    const y = (v) => P.t + ((max - v) * (Hh - P.t - P.b)) / span;
    const maxOut = Math.max(1, ...pj.series.map((s) => s.out));
    const bars = pj.series.map((s, i) => {
      if (!s.out) return '';
      const items = pj.items.filter((it) => it.date === s.date);
      const exp = items.every((it) => it.expected);
      const h = Math.max(3, (s.out / maxOut) * 52);
      return '<rect x="' + (x(i) - 4) + '" y="' + (Hh - P.b - h) + '" width="8" height="' + h + '" rx="2" fill="' + (exp ? '#c7c7cc' : '#f5c800') + '"><title>' + dateTR(s.date) + ': ' + tl(s.out) + ' — ' + items.map((it) => it.label).join(', ').replace(/[<>&]/g, '') + '</title></rect>';
    }).join('');
    const path = pj.series.map((s, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(s.balance).toFixed(1)).join('');
    const zero = min < 0 ? '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#b4362a" stroke-dasharray="4 4"/>' : '';
    const ticks = [0, Math.floor(n / 2), n - 1].map((i) => '<text x="' + x(i) + '" y="' + (Hh - 6) + '" font-size="11" fill="#6e6e73" text-anchor="' + (i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle') + '">' + dateTR(pj.series[i].date) + '</text>').join('');
    const last = pj.series[n - 1];
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + Hh + '" role="img" aria-label="30 günlük nakit projeksiyonu">' + bars + zero + '<path d="' + path + '" fill="none" stroke="#1d1d1f" stroke-width="2"/>' +
      '<text x="' + P.l + '" y="' + (y(pj.start) - 6) + '" font-size="11" fill="#1d1d1f">' + tl(pj.start) + '</text>' +
      '<text x="' + (W - P.r) + '" y="' + (y(last.balance) - 6) + '" font-size="11" fill="' + (last.balance < 0 ? '#b4362a' : '#1d1d1f') + '" text-anchor="end">' + tl(last.balance) + '</text>' + ticks + '</svg></div>';
  }

        '</div>' + extra + journalTable(plan.entry) + (plan.obligations.length ? '<div class="note"><b>Açılacak ödeme kalemleri:</b><br>' + plan.obligations.map((o) => esc(o.label) + ' — ' + tl(o.amount) + ' · vade ' + dateTR(o.due)).join('<br>') + '</div>' : '');
