<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kuzmos · Platform yönetimi</title>
<link rel="stylesheet" href="platform.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="../js/config.js"></script>
<script defer src="platform.js"></script>
</head>
<body>
<header><a href="../">Kuzmos</a><button id="logout" hidden>Çıkış yap</button></header>
<main>
  <h1>Platform yönetimi</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="login" hidden>
    <label>E-posta<input name="email" type="email" autocomplete="username" required></label>
    <label>Şifre<input name="password" type="password" autocomplete="current-password" required></label>
    <button>Giriş yap</button>
  </form>
  <section id="dashboard" hidden>
    <div class="summary">
      <div><span>İşletme</span><strong id="total"></strong></div>
      <div><span>Aktif abonelik</span><strong id="active"></strong></div>
      <div><span>Deneme bitişi yakın</span><strong id="trials"></strong></div>
    </div>
    <h2>İşletmeler</h2>
    <div class="filters">
      <label>İşletme ara<input id="search" type="search"></label>
      <label>Durum<select id="filter"><option value="">Tümü</option></select></label>
      <button id="refresh">Yenile</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>İşletme</th><th>Plan</th><th>Durum</th><th>Şube</th><th>Kullanıcı</th><th>Sipariş</th><th>Son işlem</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" hidden>Bu filtrelere uyan işletme bulunamadı.</p>
  </section>
  <dialog id="editor">
    <form id="subscription">
      <h2 id="company"></h2>
      <label>Plan<select name="plan" required></select></label>
      <label>Durum<select name="state" required></select></label>
      <label>Abonelik bitişi<input name="ends" type="date"></label>
      <label>Manuel ödeme tutarı (TL)<input name="amount" type="number" min="0.01" step="0.01"></label>
      <label>Ödeme referansı<input name="reference" type="text" maxlength="120"></label>
      <p id="editor-status" role="status"></p>
      <div class="actions"><button type="button" id="close">Kapat</button><button>Kaydet</button></div>
    </form>
    <h3>Son abonelik hareketleri</h3><ul id="history"></ul>
  </dialog>
</main>
</body>
</html>
