name: Hostinger preview package
on:
  pull_request:
    paths: ['hostinger-preview/**', '.github/workflows/hostinger-preview.yml']
  push:
    branches: ['codex/kuzmos-erp-preview']
    paths: ['hostinger-preview/**', '.github/workflows/hostinger-preview.yml']
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test hostinger-preview/server.test.mjs
      - run: node hostinger-preview/build.mjs
      - run: cmp hostinger-preview/index.html hostinger-preview/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: kuzmos-hostinger-static
          path: hostinger-preview/dist/
