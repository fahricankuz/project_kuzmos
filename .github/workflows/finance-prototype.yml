name: Finance and inventory prototype
on:
  pull_request:
    paths:
      - 'web/finance/**'
      - 'web/inventory/**'
      - 'web/tests/**'
      - 'web/templates/**'
      - '.github/workflows/finance-prototype.yml'
  push:
    branches: ['codex/kuzmos-erp-preview']
    paths:
      - 'web/finance/**'
      - 'web/inventory/**'
      - 'web/tests/**'
      - 'web/templates/**'
jobs:
  finance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/tests/*.test.mjs
